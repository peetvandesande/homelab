# /etc/systemd/networkd.conf.d/forwarding.conf  (jennie)
#
# jennie is the VPN's Internet exit, so it forwards both families. Set
# globally in systemd-networkd (systemd >= 256) rather than only via sysctl:
# networkd applies forwarding per interface after systemd-sysctl has run, and
# per-link settings default to these values.
#
# With IPv6 forwarding on, the kernel stops processing router advertisements;
# networkd handles RAs itself, so the IPv6 default route is unaffected.

[Network]
IPv4Forwarding=yes
IPv6Forwarding=yes
