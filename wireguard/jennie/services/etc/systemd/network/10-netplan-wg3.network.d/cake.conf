# CAKE on jennie's wg3, just below what the path to jennie carries (OVH caps jennie at
# ~480 Mbit/s each way; ~460 Mbit/s fits through a tunnel), so the queue forms
# here rather than at OVH. diffserv4 puts DSCP EF in its top tin, and OpenSSH
# marks interactive sessions EF (scp/sftp get CS1, the bulk tin), so typing
# stays responsive while the tunnel is saturated.
#
# Bandwidth counts inner packets; OverheadBytes adds WireGuard over IPv6
# (40 IPv6 + 8 UDP + 32 WireGuard) so the rate matches what goes on the wire.
[CAKE]
Bandwidth=440M
OverheadBytes=80
PriorityQueueingPreset=diffserv4
