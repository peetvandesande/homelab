# CAKE on jennie's uplink, just below OVH's ~480 Mbit/s cap, so the queue
# forms here rather than at OVH. Everything here is either encrypted tunnel
# traffic or the VPN exit's forwarded flows, so there is nothing to classify:
# besteffort, with CAKE's per-flow isolation keeping one busy flow - a client
# uploading through the exit, say - from queueing the tunnels behind it.
[CAKE]
Bandwidth=460M
PriorityQueueingPreset=besteffort
