# jennie's sshd: a key plus a TOTP code, nothing else.
#
# sshd takes the FIRST value it reads for each keyword, and sshd_config
# includes this directory before its own settings, so a lower-numbered file
# here wins over both cloud-init's 50-cloud-init.conf and sshd_config.
#
# The password route has to go, not just be discouraged: /etc/pam.d/sshd runs
# pam_google_authenticator alone, without common-auth, so a "password" checked
# through PAM is a TOTP code. password,keyboard-interactive was two codes and
# no password.
PasswordAuthentication no
AuthenticationMethods publickey,keyboard-interactive
