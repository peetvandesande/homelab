# jennie: wg3, S2S to home (router dials in to [2001:41d0:801:2000::180f]:51823)
network:
  version: 2
  tunnels:
    wg3:
      mode: wireguard
      port: 51823
      key: "<jennie wg3 private key>"
      mtu: 1388
      addresses:
        - "172.31.1.9/30"
        - "fd33:5692:1834:ff03::1/64"
      peers:
        # home
        - keys:
            public: "<home wg3 public key>"
            shared: "<psk home-jennie>"
          allowed-ips:
            - "172.31.1.10/32"
            - "fd33:5692:1834:ff03::2/128"
            - "192.168.8.0/21"
            - "fd33:5692:1834:1000::/56"
      routes:
        - { to: "192.168.8.0/21", scope: link }
        - { to: "fd33:5692:1834:1000::/56", scope: link }
      # The lab's internal names, straight from Pythia (its authoritative
      # server) over wg3. The ~ makes these routing-only domains: resolved
      # sends just home. and the lab's reverse zone here, everything else
      # stays on jennie's normal resolver. Not Themis or Delphi - their ACLs
      # admit only the home LAN and the Proxmox lab networks.
      nameservers:
        addresses: ["192.168.8.52"]
        search: ["~home", "~8.168.192.in-addr.arpa"]
