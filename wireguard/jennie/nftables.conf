#!/usr/sbin/nft -f
#
# /etc/nftables.conf - jennie
#
# ===========================================================================
# ADDRESS ROLES
#   57.129.180.73		primary			ens3
#   2001:41d0:801:2000::180f	primary, WireGuard	ens3
#   192.168.254.2, fd33:5692:1834:254::2	service		dummy0
#   172.31.1.4/30, fd33:5692:1834:ff02::/64	S2S to ruby	wg2
#   172.31.1.8/30, fd33:5692:1834:ff03::/64	S2S to home	wg3
# ===========================================================================
#
# Apply:  nft -c -f /etc/nftables.conf   (check, changes nothing)
#         systemctl reload nftables      (NOT restart: the unit's ExecStop is
#                                         "nft flush ruleset")
#
# Same conventions as ruby's /etc/nftables.conf:
#   - "inet" tables cover IPv4 and IPv6; "ip"/"ip6" matches are per family.
#   - No "flush ruleset": declare-then-delete clears only our own tables, so
#     this stays safe if Docker or anything else adds tables later.
#   - Multiple base chains on one hook must ALL accept a packet. If Docker is
#     ever installed here, its ip6 FORWARD policy is drop and the exit needs
#     DOCKER-USER exceptions (see ruby's wg-docker-user.service).
#
# jennie is the VPN's Internet exit: traffic from ruby's clients (wg2) and
# from home (wg3) is forwarded out of ens3 with NAT44 and NAT66. jennie
# has a single IPv4 and a single IPv6 address, so both families need NAT.
# ===========================================================================

define WAN      = "ens3"
define PUB4     = 57.129.180.73
define PUB6     = 2001:41d0:801:2000::180f
define RUBY6    = 2001:41d0:305:2100::1:3a0e
define WGIFS    = { "wg2", "wg3" }
define VPNNET4  = { 192.168.204.0/24, 192.168.8.0/21, 172.31.1.0/24 }
define VPNNET6  = fd33:5692:1834::/48

# Clear only our own tables. Declaring first makes the delete safe when the
# table does not yet exist.
table inet filter
delete table inet filter
table inet wgnat
delete table inet wgnat

# ===========================================================================
table inet filter {

    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        # --- ICMP -----------------------------------------------------------
        # ICMPv6 is NOT optional: neighbour discovery, router advertisements
        # and packet-too-big are what keep IPv6 and path MTU discovery working.
        ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
        icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept

        # --- Address configuration from OVH ---------------------------------
        # DHCP replies are broadcast/link-local and don't always match
        # conntrack; without these a lease renewal can silently fail.
        iifname $WAN udp sport 67 udp dport 68 accept
        iifname $WAN ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        # --- Administrative access ------------------------------------------
        tcp dport 22 accept

        # --- WireGuard: IPv6 only -------------------------------------------
        # wg2's peer is always ruby, so it is pinned to ruby's address.
        # wg3's peer (home) dials in from a dynamic ISP address.
        iifname $WAN ip6 saddr $RUBY6 ip6 daddr $PUB6 udp dport 51822 accept
        iifname $WAN ip6 daddr $PUB6 udp dport 51823 accept

        # --- Public services ------------------------------------------------
        # Add any services jennie offers publicly here (check: ss -tulpn).

        # --- The VPN --------------------------------------------------------
        # One trusted network: no filtering inside it.
        iifname $WGIFS accept

        counter comment "unmatched input, dropped by policy"
    }

    # -----------------------------------------------------------------------
    # FORWARD
    #
    # Policy drop: jennie has no Docker or other bridges, so everything it
    # forwards can be listed explicitly.
    # -----------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;

        # MSS clamping: wg3 has MTU 1388, wg2 1420. Without this, any path
        # that swallows ICMP "packet too big" blackholes large TCP segments.
        tcp flags syn tcp option maxseg size set rt mtu

        ct state invalid drop

        # Inside the VPN: no filtering. (jennie isn't normally a path between
        # wg2 and wg3; routing sends that traffic via ruby.)
        iifname $WGIFS oifname $WGIFS accept

        # The exit: VPN out to the Internet, replies back in.
        iifname $WGIFS oifname $WAN accept
        iifname $WAN oifname $WGIFS ct state established,related accept

        counter comment "unmatched forward, dropped by policy"
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# ===========================================================================
# NAT for the Internet exit
#
# snat, not masquerade: one fixed address per family, and no per-connection
# lookup of the interface address. Only VPN sources are translated; jennie's
# own traffic leaves untouched.
# ===========================================================================
table inet wgnat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        oifname $WAN ip  saddr $VPNNET4 counter snat ip  to $PUB4
        oifname $WAN ip6 saddr $VPNNET6 counter snat ip6 to $PUB6
    }
}
