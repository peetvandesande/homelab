# home router: wg1, S2S to ruby. wg-quick format as a reference; map these
# values onto the router's own WireGuard settings.
[Interface]
Address    = 172.31.1.2/30, fd33:5692:1834:ff01::2/64
PrivateKey = <unchanged: the router's existing private key>
MTU        = 1388

[Peer]
# ruby
PublicKey           = UFJld/qzjF6JzLwIVxayR48jfkZgTmTXhyPlK6txDCc=
PresharedKey        = <psk home>
Endpoint            = [2001:41d0:305:2100::1:3a0e]:51821
PersistentKeepalive = 25
# ruby transit + clients + ruby service addresses (dummy0/dummy1)
AllowedIPs = 172.31.1.1/32, fd33:5692:1834:ff01::1/128, 192.168.204.0/24, fd33:5692:1834:204::/64, 192.168.254.253/32, 192.168.254.254/32, fd33:5692:1834:254::254/128, fd33:5692:1834:254::253/128
