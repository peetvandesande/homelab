# home router: wg3, S2S to jennie. wg-quick format as a reference; map these
# values onto the router's own WireGuard settings.
[Interface]
Address    = 172.31.1.10/30, fd33:5692:1834:ff03::2/64
Table      = off
PrivateKey = <new key generated on the router for this tunnel>
MTU        = 1388

[Peer]
# jennie
PublicKey           = GgzHk/5dKjFJJwfoX30hfeIfJ0dPY6f7Z3ZRh9u1MW4=
PresharedKey        = <psk home-jennie>
Endpoint            = [2001:41d0:801:2000::180f]:51823
PersistentKeepalive = 25
# jennie is also an Internet exit, so the peer accepts any destination.
# As implemented on the GL router (interface wgclient2, 2026-10-09):
#   - main table: persistent route/route6 on wgclient2 for 172.31.1.9/32,
#     192.168.254.2/32, fd33:5692:1834:ff03::1/128, fd33:5692:1834:254::2/128
#   - policy rules at priority 19000 (router/README.md) send jennie's
#     dummy address to table 1002: s2s_wgclient2_254_2 and its _6 twin.
#     To add for jennie's clients (TASKS.md phase 8): s2s_wgclient2_205,
#     192.168.205.0/24, and s2s_wgclient2_205_6, fd33:5692:1834:205::/64.
#   - table 1002: default via wgclient2 (IPv4 and IPv6), used only by traffic
#     marked 0x2000 by GL route policy "UK" (tunnel 6611); targets in
#     /etc/domain_mac_list/dst_net6611_manual (BBC domains via dnsmasq, plus
#     jennie's dummy addresses)
#   - /etc/firewall.user: IPv6 masquerade to fd33:5692:1834:ff03::2 on
#     wgclient2 (hosts use their ISP IPv6 address for Internet destinations,
#     and jennie only accepts VPN addresses). Recommended form, so VPN (ULA)
#     sources keep their own address:
#       ip6tables -t nat -A POSTROUTING -o wgclient2 ! -s fd33:5692:1834::/48 -j MASQUERADE
#   - no IPv4 NAT: jennie accepts 192.168.8.0/21 and NATs it itself.
AllowedIPs = 0.0.0.0/0, ::/0
