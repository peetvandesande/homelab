# /etc/systemd/networkd.conf.d/forwarding.conf  (ruby)
#
# Global packet forwarding, owned by systemd-networkd (systemd >= 256), so it
# holds for every interface networkd manages, including the netplan WireGuard
# tunnels. Per-link IPv4Forwarding=/IPv6Forwarding= default to these values.
#
# IPv4 was already on through 10-netplan-ens3.network.d/networkd-ipforward.conf.
# IPv6 was only on because dockerd enables it ("ipv6": true); this makes it
# independent of Docker. ruby routes between the tunnels in both families.

[Network]
IPv4Forwarding=yes
IPv6Forwarding=yes
