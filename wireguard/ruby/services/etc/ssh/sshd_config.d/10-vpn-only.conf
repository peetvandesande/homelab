# ruby's sshd is reachable over the VPN only. Installed by
# forgejo/scripts/install-ruby-ssh.sh. The public :22 belongs to Forgejo,
# through nginx's stream proxy.
#
# The wg0 and dummy0 addresses: wg0 for road warriors, dummy0 for home and
# jennie, which route to it over wg1/wg2.
# If ssh.socket is in use these are ignored and its drop-in rules instead.
ListenAddress 192.168.204.254
ListenAddress 192.168.254.254
ListenAddress fd33:5692:1834:204::254
ListenAddress fd33:5692:1834:254::254
