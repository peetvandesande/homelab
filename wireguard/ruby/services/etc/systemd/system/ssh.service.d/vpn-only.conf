# sshd binds wg0 and dummy0 addresses (sshd_config.d/10-vpn-only.conf), so it
# waits for networkd to configure them, or the bind fails at boot.
[Unit]
After=systemd-networkd-wait-online@wg0:routable.service systemd-networkd-wait-online@dummy0:routable.service
Wants=systemd-networkd-wait-online@wg0:routable.service systemd-networkd-wait-online@dummy0:routable.service
