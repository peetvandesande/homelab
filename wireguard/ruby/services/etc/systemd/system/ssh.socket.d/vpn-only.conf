# Only used if sshd is socket-activated. The same four addresses as
# sshd_config.d/10-vpn-only.conf, replacing the default :22 on everything.
# FreeBind lets the socket bind before networkd has configured wg0 and dummy0.
# Named to sort after a generator's addresses.conf, so the reset wins.
[Socket]
ListenStream=
ListenStream=192.168.204.254:22
ListenStream=192.168.254.254:22
ListenStream=[fd33:5692:1834:204::254]:22
ListenStream=[fd33:5692:1834:254::254]:22
FreeBind=yes
