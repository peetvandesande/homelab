# /etc/systemd/system/dovecot.service.d/dovecot-local-deps.conf
#
# Dovecot binds wg0 and dummy0 addresses (192.168.204.254,
# fd33:5692:1834:204::254, 192.168.254.254, fd33:5692:1834:254::254) for
# managesieve. If an address is not yet configured the bind fails and dovecot
# refuses to start - the same trap that catches Postfix, and for the same
# reason.
#
# wg0 and dummy0 are managed by systemd-networkd (netplan), so wait for
# networkd to report each of them routable, i.e. addresses configured. This
# replaced "After=wg-quick@wg0.service" when wg0 moved from wg-quick to netplan.
#
# named is included because Dovecot resolves the MySQL host and does reverse
# lookups on client addresses; without DNS it starts but logs are unhelpful.
#
# Install with:
#   cp dovecot-local-deps.conf /etc/systemd/system/dovecot.service.d/
#   systemctl daemon-reload

[Unit]
After=network-online.target named.service mariadb.service systemd-networkd-wait-online@wg0:routable.service systemd-networkd-wait-online@dummy0:routable.service
Wants=network-online.target named.service mariadb.service systemd-networkd-wait-online@wg0:routable.service systemd-networkd-wait-online@dummy0:routable.service
