# /etc/systemd/system/dovecot.service.d/local-deps.conf
#
# Dovecot binds 192.168.204.254 for imaps and managesieve. If wg0 is not yet
# configured the bind fails and dovecot refuses to start - the same trap that
# catches Postfix, and for the same reason.
#
# named is included because Dovecot resolves the MySQL host and does reverse
# lookups on client addresses; without DNS it starts but logs are unhelpful.
#
# Install with:
#   mkdir -p /etc/systemd/system/dovecot.service.d
#   cp dovecot-local-deps.conf /etc/systemd/system/dovecot.service.d/
#   systemctl daemon-reload
#
# Confirm the unit name first: systemctl list-units 'dovecot*'
# Debian 13 ships dovecot.service; some builds also carry a socket unit.

[Unit]
After=network-online.target named.service mariadb.service wg-quick@wg0.service
Wants=network-online.target named.service mariadb.service
