# ruby: service addresses reachable across the VPN.
# IPv6 renumbered from fd00::1/fd00::2 into the VPN's ULA prefix (2026-10-09);
# ::254/::253 match the IPv4 addresses.
network:
  version: 2
  dummy-devices:
    dummy0:
      addresses:
        - "192.168.254.254/32"
        - "fd33:5692:1834:254::254/128"
    dummy1:
      addresses:
        - "192.168.254.253/32"
        - "fd33:5692:1834:254::253/128"
