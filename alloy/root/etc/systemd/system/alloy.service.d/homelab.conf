# The packaged unit runs as alloy, which by default can read neither the
# journal nor the TLS key.
#
# systemd-journal and adm: the journal. Without them Alloy starts cleanly and
# ships nothing - there is no error to see, so this is the first thing to
# check when a host goes quiet in Loki.
#
# tlscert: the private key is root:tlscert 0640. Named here rather than
# relying on usermod alone so it survives the unit ever gaining PrivateUsers=,
# which drops supplementary groups (see prometheus/ for where that bit).
[Service]
SupplementaryGroups=systemd-journal adm tlscert
