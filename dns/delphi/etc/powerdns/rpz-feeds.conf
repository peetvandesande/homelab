# Feeds fetched by rpz-update. One per line:
#
#   <name>  <minimum-expected-lines>  <url>
#
# <name> becomes /var/lib/powerdns/rpz/<name>.rpz and must match the policyName
# used in recursor.lua and the entry in ALL_POLICIES in policy.lua. Each name
# must be unique: the updater installs one file per name, so two lines sharing
# one would overwrite each other and flap on every run.
#
# The minimum line count is a tripwire: an upstream that starts serving a 404
# page, a truncated file or an empty list gets rejected rather than silently
# unblocking everything. Set it to roughly 75% of the current size - the
# comments record what each was when it was last checked (2026-10-11).

# --- default set: applies to every client ------------------------------------
ads         300000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/pro.txt
malware    1000000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/tif.medium.txt

# --- kids set ----------------------------------------------------------------
adult       140000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/nsfw.txt
gambling    330000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/gambling.medium.txt
nosafesearch   300   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/nosafesearch.txt
social        1400   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/social.txt
dohbypass    25000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/doh-vpn-proxy-bypass.txt

# --- iot set: vendor telemetry -----------------------------------------------
native_samsung  300  https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/native.samsung.txt
native_lgwebos  350  https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/native.lgwebos.txt
native_roku     120  https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/native.roku.txt
native_tiktok   700  https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/native.tiktok.txt

# Sizes as measured 2026-10-11: ads 386733, malware 1267456, adult 179624,
# gambling 414458, nosafesearch 422, social 1825, dohbypass 31363,
# native_samsung 416, native_lgwebos 476, native_roku 162, native_tiktok 910.
#
# Deliberately NOT enabled: native.apple and native.amazon break real
# functionality (device setup, Alexa, Prime Video) rather than just telemetry.
# pro.plus.txt is the more aggressive ads list if you want it and will keep
# allowlist.conf up to date.
