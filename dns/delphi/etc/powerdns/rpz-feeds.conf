# Feeds fetched by rpz-update. One per line:
#
#   <name>  <minimum-expected-lines>  <url>
#
# <name> becomes /var/lib/powerdns/rpz/<name>.rpz and must match the
# policyName used in recursor.lua (and, for kids-only feeds, in policy.lua).
#
# The minimum line count is a tripwire: an upstream that starts serving a 404
# page, a truncated file or an empty list gets rejected rather than silently
# unblocking everything.

malware   400000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/tif.medium.txt
adult     100000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/nsfw.txt
social      500    https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/social.txt

