# Feeds fetched by rpz-update. One per line:
#
#   <name>  <floor>  <url>
#
# <name> becomes /var/lib/powerdns/rpz/<name>.rpz and must match the policyName
# used in recursor.lua and the entry in ALL_POLICIES in policy.lua. Each name
# must be unique: the updater installs one file per name, so two lines sharing
# one would overwrite each other and flap on every run.
#
# Two checks stop a bad download replacing a good one. The main one is that a
# feed holds exactly as many entries as its own "Number of entries" header says,
# which catches a truncated file at any size. The floor is only a backstop for an
# upstream that publishes a nearly empty list: about 10% of the size measured on
# 10 November 2026, so normal churn never reaches it.
#
# Until then the floor was the only check, at 75% of the size, and hagezi's lists
# move more than that: it was lowered for malware on 26 October and for gambling
# on 8 November, and gambling fell again to 181036 on 10 November, a complete,
# valid download each time.

# --- default set: applies to every client ------------------------------------
ads          40000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/pro.txt
malware      70000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/tif.medium.txt
doh            700   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/doh.txt

# --- kids set ----------------------------------------------------------------
adult        15000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/nsfw.txt
gambling     18000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/gambling.medium.txt
nosafesearch    40   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/nosafesearch.txt
social        1600   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/social.txt
dohbypass     3000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/doh-vpn-proxy-bypass.txt

# --- iot set: vendor telemetry -----------------------------------------------
native_samsung  40  https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/native.samsung.txt
native_lgwebos  60  https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/native.lgwebos.txt
native_roku     10  https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/native.roku.txt
native_tiktok  100  https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/native.tiktok.txt

# Entries on 10 November 2026: ads 447922, malware 733016, doh 7136, adult 149478,
# gambling 181036, nosafesearch 400, social 16318, dohbypass 32848,
# native_samsung 402, native_lgwebos 630, native_roku 114, native_tiktok 1090.
#
# doh is the encrypted-DNS-only subset of dohbypass: resolver hostnames and
# nothing else, so it is safe for every client. dohbypass also lists VPN, Tor
# and proxy providers, which is why it stays in the kids set. The names are one
# half of the DoH block - the router rejects the well-known resolver IPs on
# :443 for anything that hard-codes its resolver (router/CLAUDE.md). The
# Firefox canary use-application-dns.net is not in this list; Themis answers
# it NXDOMAIN itself (dnsdist.conf).
#
# Deliberately NOT enabled: native.apple and native.amazon break real
# functionality (device setup, Alexa, Prime Video) rather than just telemetry.
# pro.plus.txt is the more aggressive ads list if you want it and will keep
# allowlist.conf up to date.
