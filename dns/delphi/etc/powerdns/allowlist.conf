# Names exempted from filtering, one per line. An entry covers the name and
# everything under it, so `example.com` also exempts `cdn.example.com`.
#
# This overrides every feed EXCEPT malware. For a malware false positive, use
# allowlist-malware.conf instead and read the warning at the top of it.
#
# Applies to all clients, including tagged ones - an entry here un-blocks the
# name for the kids policy set too. There is no per-set allowlist; if you need
# one, say so rather than working around it with a per-device exemption.
#
# After editing: ./scripts/deploy.sh

# iCloud Private Relay. hagezi's doh feed lists Apple's relay ingress and its
# oblivious-DoH resolver, and without them every Apple device reports Private
# Relay as blocked by the network. Allowed on purpose: Private Relay is a DNS
# and traffic bypass of Themis by design, and that is the accepted trade-off
# for the devices that have it switched on. mask-canary is Apple's own test
# name; the aaplimg names are what doh.dns.apple.com CNAMEs to.
mask.icloud.com
mask-h2.icloud.com
mask-canary.icloud.com
mask-api.fe.apple-dns.net
doh.dns.apple.com
doh.dns.apple.com.v.aaplimg.com
doh-dns-apple-com.v.aaplimg.com
