# Names exempted from filtering, one per line. An entry covers the name and
# everything under it, so `example.com` also exempts `cdn.example.com`.
#
# This overrides every feed EXCEPT malware. For a malware false positive, use
# allowlist-malware.conf instead and read the warning at the top of it.
#
# Applies to all clients, including tagged ones - an entry here un-blocks the
# name for the kids policy set too. There is no per-set allowlist; if you need
# one, say so rather than working around it with a per-device exemption.
#
# After editing: ./scripts/deploy.sh
