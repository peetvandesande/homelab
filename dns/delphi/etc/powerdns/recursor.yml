# Delphi - recursion and filtering.
#
# Receives every query from Themis over PROXY protocol, which carries both the
# real client IP and the policy tag Themis stamped. The RPZ feeds are declared
# in recursor.lua; policy.lua decides which of them apply to each query.
#
# Recursor 5.x rejects the old key=value recursor.conf unless started with
# --enable-old-settings, so this is YAML. `rec_control show-yaml <oldfile>`
# converts an old-style file if you ever need to.
#
# Managed from homelab/dns - edit there, not here.

incoming:
  listen:
    - 192.168.8.51
    # The ULA twin, published as delphi.home's AAAA. The wait-for-address
    # drop-in waits for it, DAD included.
    - 'fd33:5692:1834:1000:be24:11ff:fe7d:3b06'
  port: 53
  # Themis is the only thing that talks to us directly, but once the PROXY
  # header is decoded allow_from is matched against the *real* client, so this
  # has to be the client range - not 192.168.8.50.
  allow_from:
    - 192.168.8.0/24
    - 192.168.32.0/21  # Proxmox lab networks, routed by lenora
    - 127.0.0.0/8
    # The IPv6 twin of the first entry, and for the same reason as the comment
    # above: this is matched against the real client out of the PROXY header,
    # so it is the client's own ULA, never Themis's. The labs have no IPv6.
    - 'fd33:5692:1834:1000::/64'
    - '::1/128'
  proxy_protocol_from:
    - 192.168.8.50/32
    # Themis's ULA. A query that arrives over IPv6 carries a PROXY header from
    # Themis's v6 address, and a source missing here has its header ignored -
    # so allow_from would then match Themis instead of the client and refuse
    # every one of them.
    - 'fd33:5692:1834:1000:be24:11ff:feda:9b4b/128'

recursor:
  threads: 2

  # Our own zones live on Pythia. recurse:false sends these with RD=0, which is
  # correct for an authoritative server and guarantees these names are never
  # looked up on the internet.
  forward_zones:
    - zone: home.
      recurse: false
      forwarders:
        - 192.168.8.52
    - zone: 8.168.192.in-addr.arpa.
      recurse: false
      forwarders:
        - 192.168.8.52
    # The lab LAN's ULA reverse zone, fd33:5692:1834:1000::/64. Pythia
    # generates its PTRs from the same forward records as the IPv4 zone above
    # (dns/ansible/group_vars/all.yml). Needs the addNTA() in recursor.lua for
    # the same reason every zone here does: ip6.arpa IS signed, and d.f.ip6.arpa
    # is not delegated, so validation finds a good proof that this zone does not
    # exist and SERVFAILs before Pythia's answer is considered.
    - zone: 0.0.0.1.4.3.8.1.2.9.6.5.3.3.d.f.ip6.arpa.
      recurse: false
      forwarders:
        - 192.168.8.52
    # Reverse zones of the Proxmox lab range, 192.168.32.0/21. They live in
    # Pythia's gsqlite3 backend and exist only while a lab is running; the
    # forward zone (openstack.home etc.) is covered by home. above. Keep in
    # step with the addNTA() loop in recursor.lua.
    - zone: 32.168.192.in-addr.arpa.
      recurse: false
      forwarders:
        - 192.168.8.52
    - zone: 33.168.192.in-addr.arpa.
      recurse: false
      forwarders:
        - 192.168.8.52
    - zone: 34.168.192.in-addr.arpa.
      recurse: false
      forwarders:
        - 192.168.8.52
    - zone: 35.168.192.in-addr.arpa.
      recurse: false
      forwarders:
        - 192.168.8.52
    - zone: 36.168.192.in-addr.arpa.
      recurse: false
      forwarders:
        - 192.168.8.52
    - zone: 37.168.192.in-addr.arpa.
      recurse: false
      forwarders:
        - 192.168.8.52
    - zone: 38.168.192.in-addr.arpa.
      recurse: false
      forwarders:
        - 192.168.8.52
    - zone: 39.168.192.in-addr.arpa.
      recurse: false
      forwarders:
        - 192.168.8.52
    # The customers invented by a Proxmox lab get mailboxes on hermes under a
    # domain in example., which RFC 2606 reserves, so it never exists at the
    # root and can be ours in full: a lab creates and deletes <customer>.example
    # in Pythia's gsqlite3 backend, and nothing here changes per customer.
    # Keep in step with the addNTA() in recursor.lua.
    - zone: example.
      recurse: false
      forwarders:
        - 192.168.8.52
    # Split-horizon: this one name resolves to pistis inside the lab, not to
    # the public VPS. Only the single name is forwarded - the rest of
    # peetvandesande.com still recurses to the internet normally. Requires the
    # matching addNTA() in recursor.lua; the domain is signed.
    - zone: ca.peetvandesande.com.
      recurse: false
      forwarders:
        - 192.168.8.52
    # Same again for the mail server: ruby answers IMAP only on its WireGuard
    # address, so the public name has to resolve inside the lab. Needs the
    # matching addNTA() too.
    - zone: mail.peetvandesande.com.
      recurse: false
      forwarders:
        - 192.168.8.52
    # And for ruby's web admin pages, which nginx admits only from home and
    # VPN ranges - over the internet a LAN client arrives from its ISP address.
    - zone: ruby.peetvandesande.com.
      recurse: false
      forwarders:
        - 192.168.8.52

  lua_config_file: /etc/powerdns/recursor.lua
  lua_dns_script: /etc/powerdns/policy.lua

dnssec:
  validation: validate

# Memory budget. The feeds are the fixed cost: ~2.3M RPZ entries across eleven
# zones, and a daily refresh holds the old and new copy of a zone at once, so
# peak is higher than steady state. The caches are what is left over. Raise the
# container's RAM before raising these - delphi has 6GB.
recordcache:
  max_entries: 1500000
packetcache:
  max_entries: 500000

webservice:
  # Loopback only: the recursor cannot serve TLS - there is no certificate
  # setting anywhere in its configuration. nginx terminates TLS on :8082 and
  # proxies here, so allow_from only ever sees 127.0.0.1 and real access
  # control lives in the nginx vhost.
  webserver: true
  address: 127.0.0.1
  port: 8282
  allow_from:
    - 127.0.0.1
  api_key: "@@RECURSOR_API_KEY@@"
