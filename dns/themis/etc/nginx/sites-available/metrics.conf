# TLS termination for the dnsdist webserver.
#
# None of the three PowerDNS components can serve TLS itself: the auth server
# and the recursor have no certificate settings at all, and dnsdist accepts
# `certificate`/`key` on setWebserverConfig and then silently serves plain
# HTTP. So the backend binds loopback and nginx fronts it.
#
# Listens on the wildcard rather than the static address on purpose - that is
# what lets it skip the wait-for-address drop-in the DNS listeners need.

server {
    listen 8083 ssl default_server;
    listen [::]:8083 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/homelab-tls/host.crt;
    ssl_certificate_key /etc/homelab-tls/host.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The backend's own ACL now only ever sees 127.0.0.1, so access control for
    # the outside world lives here. Same posture as before: Prometheus only.
    allow 192.168.1.53;
    allow 127.0.0.1;
    deny  all;

    location / {
        proxy_pass http://127.0.0.1:8383;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
