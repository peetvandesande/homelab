-- Devices subject to the kids policy (adult-content + social-media feeds on
-- top of the malware feed everyone gets).
--
-- The LAN is flat - one /24, no VLANs - so there is no "kids subnet" to match
-- on. Membership is therefore an explicit per-device list.
--
-- IMPORTANT: give each device a DHCP *reservation* on the router first,
-- otherwise its address will drift and it will silently fall out of the policy.
--
-- After editing:   systemctl reload dnsdist   (or: dnsdist -c  then  reloadAllCertificates)
-- Verify a device: dig @192.168.1.50 pornhub.com +short   (from that device)

kidsDevices = newNMG()

-- kidsDevices:addMask("192.168.1.71/32")   -- e.g. child-1 tablet
-- kidsDevices:addMask("192.168.1.72/32")   -- e.g. child-2 laptop
-- kidsDevices:addMask("192.168.1.73/32")   -- e.g. family room TV

-- A whole reserved range works too, if you later pin kids' devices into one:
-- kidsDevices:addMask("192.168.1.150/26")  -- .150-.191
