-- Which clients get which policy set.
--
-- A policy set is a named bundle of RPZ feeds, defined in
-- delphi/etc/powerdns/policy.lua. Themis decides which set a client belongs
-- to and stamps the name into a PROXY protocol TLV; Delphi applies it. Keep
-- the names here in step with POLICY_SETS there.
--
-- Clients matching nothing get the default set (ads + malware), which is why
-- there is no entry for it: it is the absence of a tag.
--
-- IMPORTANT: give each device a DHCP *reservation* on the router first,
-- otherwise its address will drift and it will silently fall out of the
-- policy. Reservations live on the router, not in this repo.
--
-- After editing:   ./scripts/deploy.sh
-- Verify a device: dig @192.168.8.50 bsky.app   (from that device -> NXDOMAIN)

clientPolicies = {}

-- kids: adult, gambling, social, safe-search enforcement and DoH/VPN bypass
-- blocking on top of the default set.
--
-- The LAN is flat - one /24, no VLANs - so there is no "kids subnet" to match
-- on and membership is an explicit per-device list.
clientPolicies["kids"] = newNMG()
-- clientPolicies["kids"]:addMask("192.168.8.71/32")   -- e.g. kids laptop
-- clientPolicies["kids"]:addMask("192.168.8.72/32")   -- e.g. child-2 tablet

-- iot: vendor telemetry feeds on top of the default set.
--
-- Scoped by network rather than by device, because VLAN 10 exists for exactly
-- this. Nothing in the lab uses tag=10 yet; when something does, uncomment the
-- subnet and add 192.168.10.0/24 to setACL() in dnsdist.conf - Themis has no
-- address on that network today.
clientPolicies["iot"] = newNMG()
-- clientPolicies["iot"]:addMask("192.168.10.0/24")
