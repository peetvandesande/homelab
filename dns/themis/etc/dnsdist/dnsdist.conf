-- Themis - the only resolver anything on the LAN talks to.
--
-- Job: decide *who* is asking, stamp a policy tag on the query, and hand it to
-- Delphi. All filtering and recursion happens on Delphi; Themis makes no
-- blocking decisions of its own.
--
-- The one exception is the VPN-domain shunt below, which is a routing concern
-- rather than a filtering one: those names must be answered by the router so
-- its policy-based routing works at all. See invariant 11 in CLAUDE.md.
--
-- The tag travels to Delphi inside a PROXY protocol TLV (type 224). Using
-- PROXY protocol rather than EDNS also means Delphi sees the *real* client IP
-- instead of Themis's, so blocked-query logs name the device that asked.
--
-- Managed from homelab/dns - edit there, not here.

-------------------------------------------------------------------------------
-- Listeners
-------------------------------------------------------------------------------
setLocal("192.168.8.50:53")
addLocal("127.0.0.1:53")

-- Encrypted transports, off the lab CA (homelab/ca). Both bind the static
-- address, which is why the wait-for-address drop-in still matters: without it
-- these lose the bind race on a cold boot exactly as :53 would.
--
-- The certificate is this host's, issued to themis.home with an IP SAN. A
-- client pinning the IP verifies against that SAN; since the DHCP cutover a
-- client can also resolve themis.home and verify the name. Nothing changes
-- here either way; only what clients type.
--
-- Queries arriving over DoT and DoH go through the same rule chain as Do53, so
-- policy tagging and the VPN shunt apply identically. Do not add a separate
-- path for them.
addTLSLocal("192.168.8.50:853", "/etc/homelab-tls/host.crt", "/etc/homelab-tls/host.key")
addDOHLocal("192.168.8.50:443", "/etc/homelab-tls/host.crt", "/etc/homelab-tls/host.key", "/dns-query")

-- Only the LAN and the Proxmox lab networks (192.168.32.0/21, routed by
-- lenora) may query us. Add 192.168.10.0/24 here if the iot policy set in
-- client-policies.conf is ever enabled. Delphi's allow_from must match.
setACL({"192.168.8.0/24", "192.168.32.0/21", "127.0.0.0/8", "::1/128"})

-------------------------------------------------------------------------------
-- Policy sets
--
-- One bundle of RPZ feeds per set, named identically on both sides: the names
-- below are the TLV values Themis stamps, and the keys of POLICY_SETS in
-- delphi/etc/powerdns/policy.lua. A client matching nothing gets the default
-- set, which is the absence of a tag.
-------------------------------------------------------------------------------
POLICY_SETS = {"kids", "iot"}

-- clientPolicies[<set>] -> NetmaskGroup
dofile("/etc/dnsdist/client-policies.conf")

-------------------------------------------------------------------------------
-- Backend: Delphi
--
-- One server, in one pool per policy set. The pool split exists purely so each
-- policy gets its OWN packet cache: a single shared cache would happily serve a
-- kids NXDOMAIN to an adult device (and vice versa), because the cache keys on
-- the question, not on the tag we attached.
-------------------------------------------------------------------------------
delphiPools = {""}
for _, set in ipairs(POLICY_SETS) do table.insert(delphiPools, set) end

newServer({
  address        = "192.168.8.51:53",
  name           = "delphi",
  useProxyProtocol = true,
  pool           = delphiPools,
  checkName      = "a.root-servers.net.",
  checkType      = "A",
  checkInterval  = 5,
  maxCheckFailures = 3,
})

-- Sized for how much of the LAN shares each policy: most devices are in the
-- default set, a handful in the others.
getPool(""):setCache(newPacketCache(200000, {maxTTL=86400, minTTL=0, temporaryFailureTTL=60, staleTTL=60}))
for _, set in ipairs(POLICY_SETS) do
  getPool(set):setCache(newPacketCache(50000, {maxTTL=86400, minTTL=0, temporaryFailureTTL=60, staleTTL=60}))
end

-- Serve the last known good answer if Delphi goes away entirely.
setStaleCacheEntriesTTL(600)

-------------------------------------------------------------------------------
-- Backends: the router's per-tunnel dnsmasq instances
--
-- The router routes by destination IP: its dnsmasq adds the addresses from the
-- answers *it* returns to an ipset, and the policy matches on that set. So a
-- name under a domain policy has to be answered by the router or the routing
-- never fires. Each tunnel has its own dnsmasq instance, marked into that
-- tunnel and resolving through it, which is also what makes a CDN hand back
-- edges in the right country.
--
-- These names therefore bypass Delphi: no RPZ, no DNSSEC validation. That is
-- the trade, and for broadcaster domains it is mostly a feature - the ads feed
-- would otherwise block the telemetry names the policy itself lists.
--
-- vpnPolicies is generated by vpn-domain-sync, hourly, straight from the
-- router. It is host state rather than something this repo pushes, which is why
-- it lives under /var/lib and not /etc - deploying must not overwrite a list
-- that is newer than the checkout.
--
-- Tolerating its absence is deliberate: a fresh Themis has no list until the
-- first sync, and `dofile` on a missing file is fatal. Starting with no shunt
-- means the policy domains resolve normally and the tunnel simply isn't used -
-- degraded, not down. The vpn_domain_sync_* metrics are what tell you, so keep
-- the Grafana alert in step with this.
-------------------------------------------------------------------------------
vpnPolicies = {}
local vpnState = "/var/lib/dnsdist/vpn-domains.conf"
local vpnFh = io.open(vpnState, "r")
if vpnFh then vpnFh:close(); dofile(vpnState) end

-- Fallback for every VPN pool: the router's main dnsmasq instance. It symlinks
-- the same via_domain file, so the ipset still fills when a tunnel is down -
-- just with addresses from the wrong country. Resolving is better than not.
ROUTER_DNS = "192.168.8.1:53"

for _, p in ipairs(vpnPolicies) do
  newServer({address = p.resolver, name = p.tunnel .. "-dns", pool = p.pool,
             order = 1, checkName = "a.root-servers.net.", checkType = "A",
             checkInterval = 15, maxCheckFailures = 2})
  newServer({address = ROUTER_DNS, name = "router-dns-" .. p.pool, pool = p.pool,
             order = 2, checkName = "a.root-servers.net.", checkType = "A",
             checkInterval = 15})
  -- order, not least-outstanding: while the tunnel's resolver is healthy it
  -- must win every time, or answers silently alternate between countries.
  setPoolServerPolicy(firstAvailable, p.pool)
  -- No packet cache on these pools, deliberately. A router reboot flushes the
  -- ipset, and a cache hit here would mean nothing ever refills it.
  --
  -- One match node per policy, because each routes to its own pool.
  p.match = newSuffixMatchNode()
  for _, d in ipairs(p.domains) do p.match:add(d) end
end

-------------------------------------------------------------------------------
-- Hygiene
-------------------------------------------------------------------------------
-- ANY is only ever useful for amplification.
addAction(QTypeRule(DNSQType.ANY), RCodeAction(DNSRCode.REFUSED))

-- A single device melting down shouldn't take the LAN's DNS with it. This is
-- per client address, so it stays meaningful only as long as clients query us
-- directly rather than through a forwarder.
addAction(MaxQPSIPRule(200), DropAction())

-------------------------------------------------------------------------------
-- Routing
--
-- Order matters, twice over:
--
--  1. The VPN shunt is first and terminal, so a domain under a routing policy
--     goes to the router even for a tagged client. That is what lets the kids
--     laptop reach iPlayer and Bitesize through the UK tunnel while everything
--     else it asks for stays filtered.
--  2. Within a policy set, stamp the TLV first (non-terminal), then route to
--     the pool (terminal).
--
-- Queries matching nothing fall through to the default pool with no TLV
-- attached, and Delphi applies the default set.
-------------------------------------------------------------------------------
for _, p in ipairs(vpnPolicies) do
  addAction(SuffixMatchNodeRule(p.match), PoolAction(p.pool))
end

for _, set in ipairs(POLICY_SETS) do
  addAction(NetmaskGroupRule(clientPolicies[set]), SetProxyProtocolValuesAction({[224] = set}))
  addAction(NetmaskGroupRule(clientPolicies[set]), PoolAction(set))
end

-------------------------------------------------------------------------------
-- Metrics + control
-------------------------------------------------------------------------------
-- Loopback only. dnsdist's webserver cannot do TLS - setWebserverConfig
-- accepts `certificate` and `key` without complaint and then serves plain
-- HTTP, and --check-config does not catch it because unknown parameters are
-- silently ignored. So nginx terminates TLS on :8083 and proxies here.
webserver("127.0.0.1:8383")
setWebserverConfig({
  -- scrypt hash of DNSDIST_API_KEY from secrets.env, minted by deploy.sh.
  apiKey = "@@DNSDIST_API_KEY_HASHED@@",
  -- Requests now arrive from nginx on loopback, so the ACL must admit it.
  -- Access control for the outside world moved to nginx.
  acl    = "127.0.0.0/8",
  -- Prometheus can't send an X-API-Key header, so /metrics is left open to
  -- the ACL above while the mutating API endpoints stay key-protected.
  statsRequireAuthentication = false,
})

controlSocket("127.0.0.1:5199")
setKey("@@DNSDIST_CONSOLE_KEY@@")
