-- Themis - the only resolver anything on the LAN talks to.
--
-- Job: decide *who* is asking, stamp a policy tag on the query, and hand it to
-- Delphi. All filtering and recursion happens on Delphi; Themis makes no
-- blocking decisions of its own.
--
-- The tag travels to Delphi inside a PROXY protocol TLV (type 224). Using
-- PROXY protocol rather than EDNS also means Delphi sees the *real* client IP
-- instead of Themis's, so blocked-query logs name the device that asked.
--
-- Managed from homelab/dns - edit there, not here.

-------------------------------------------------------------------------------
-- Listeners
-------------------------------------------------------------------------------
setLocal("192.168.1.50:53")
addLocal("127.0.0.1:53")

-- Encrypted transports, off the lab CA (homelab/ca). Both bind the static
-- address, which is why the wait-for-address drop-in still matters: without it
-- these lose the bind race on a cold boot exactly as :53 would.
--
-- The certificate is this host's, issued to themis.home with an IP SAN. Until
-- the DHCP cutover, clients cannot resolve themis.home to verify a name, so
-- they must pin the IP - which the SAN supports. Nothing changes here after
-- the cutover; only what clients type.
--
-- Queries arriving over DoT and DoH go through the same rule chain as Do53, so
-- kids tagging and the pool split apply identically. Do not add a separate
-- path for them.
addTLSLocal("192.168.1.50:853", "/etc/homelab-tls/host.crt", "/etc/homelab-tls/host.key")
addDOHLocal("192.168.1.50:443", "/etc/homelab-tls/host.crt", "/etc/homelab-tls/host.key", "/dns-query")

-- Only the LAN may query us.
setACL({"192.168.1.0/24", "127.0.0.0/8", "::1/128"})

-------------------------------------------------------------------------------
-- Backend: Delphi
--
-- One server, in two pools. The pool split exists purely so each policy gets
-- its OWN packet cache: a single shared cache would happily serve a kids
-- NXDOMAIN to an adult device (and vice versa), because the cache keys on the
-- question, not on the tag we attached.
-------------------------------------------------------------------------------
newServer({
  address        = "192.168.1.51:53",
  name           = "delphi",
  useProxyProtocol = true,
  pool           = {"", "kids"},
  checkName      = "a.root-servers.net.",
  checkType      = "A",
  checkInterval  = 5,
  maxCheckFailures = 3,
})

pcDefault = newPacketCache(200000, {maxTTL=86400, minTTL=0, temporaryFailureTTL=60, staleTTL=60})
pcKids    = newPacketCache(50000,  {maxTTL=86400, minTTL=0, temporaryFailureTTL=60, staleTTL=60})
getPool(""):setCache(pcDefault)
getPool("kids"):setCache(pcKids)

-- Serve the last known good answer if Delphi goes away entirely.
setStaleCacheEntriesTTL(600)

-------------------------------------------------------------------------------
-- Who counts as "kids"
-------------------------------------------------------------------------------
-- kidsDevices is defined in kids-devices.conf, loaded below.
dofile("/etc/dnsdist/kids-devices.conf")

-------------------------------------------------------------------------------
-- Hygiene
-------------------------------------------------------------------------------
-- ANY is only ever useful for amplification.
addAction(QTypeRule(DNSQType.ANY), RCodeAction(DNSRCode.REFUSED))

-- A single device melting down shouldn't take the LAN's DNS with it.
addAction(MaxQPSIPRule(200), DropAction())

-------------------------------------------------------------------------------
-- Tagging
--
-- Order matters: stamp the TLV first (non-terminal), then route to the kids
-- pool (terminal). Queries that match neither fall through to the default
-- pool with no TLV attached, and Delphi applies malware filtering only.
-------------------------------------------------------------------------------
addAction(NetmaskGroupRule(kidsDevices), SetProxyProtocolValuesAction({[224] = "kids"}))
addAction(NetmaskGroupRule(kidsDevices), PoolAction("kids"))

-------------------------------------------------------------------------------
-- Metrics + control
-------------------------------------------------------------------------------
-- Loopback only. dnsdist's webserver cannot do TLS - setWebserverConfig
-- accepts `certificate` and `key` without complaint and then serves plain
-- HTTP, and --check-config does not catch it because unknown parameters are
-- silently ignored. So nginx terminates TLS on :8083 and proxies here.
webserver("127.0.0.1:8383")
setWebserverConfig({
  -- scrypt hash of DNSDIST_API_KEY from secrets.env, minted by deploy.sh.
  apiKey = "@@DNSDIST_API_KEY_HASHED@@",
  -- Requests now arrive from nginx on loopback, so the ACL must admit it.
  -- Access control for the outside world moved to nginx.
  acl    = "127.0.0.0/8",
  -- Prometheus can't send an X-API-Key header, so /metrics is left open to
  -- the ACL above while the mutating API endpoints stay key-protected.
  statsRequireAuthentication = false,
})

controlSocket("127.0.0.1:5199")
setKey("@@DNSDIST_CONSOLE_KEY@@")
