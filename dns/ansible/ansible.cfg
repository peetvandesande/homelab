# Self-contained: run ansible-playbook from this directory and it finds
# everything. No system-wide ansible config is involved.
[defaults]
inventory          = inventory.yml
roles_path         = roles
host_key_checking  = False
result_format      = yaml
display_skipped_hosts = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args   = -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPath=/tmp/.dnsans-%C -o ControlPersist=60s
