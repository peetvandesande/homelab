# In an LXC with ifupdown, network-online.target is reached before eth0
# actually has its address, so a service binding to a specific IP can lose the
# race. Observed on themis after a cold boot: port 53 bound but the webserver
# got "Cannot assign requested address" and stayed down until a manual restart.
#
# Wait for the address before starting. The leading "+" runs this outside the
# unit's sandbox: these units set RestrictAddressFamilies=AF_UNIX AF_INET
# AF_INET6, which blocks the AF_NETLINK socket "ip" needs, and the check would
# otherwise fail with "Cannot open netlink socket".
#
# Appends to any ExecStartPre the packaged unit defines, so it runs after those.
[Service]
ExecStartPre=+/bin/sh -c 'n=0; while [ $n -lt 120 ]; do ip -4 addr show dev eth0 | grep -q "inet 192.168.8.52/" && exit 0; n=$((n+1)); sleep 0.5; done; echo "192.168.8.52 never appeared on eth0" >&2; exit 1'

# The same for the ULA, which these services now bind too. Two things differ
# from the IPv4 wait and both matter:
#
#   - SLAAC, not DHCP, so the address appears on its own schedule after the
#     first Router Advertisement. It is routinely LATER than the v4 address,
#     which is why this cannot simply ride on the check above.
#   - `-tentative` excludes an address still running Duplicate Address
#     Detection. A tentative address is present in `ip addr` output and cannot
#     be bound - bind() returns EADDRNOTAVAIL - so matching without this flag
#     reintroduces exactly the cold-boot race the file exists to close, in a
#     form that looks like it is working.
ExecStartPre=+/bin/sh -c 'n=0; while [ $n -lt 120 ]; do ip -6 addr show dev eth0 -tentative | grep -q "inet6 fd33:5692:1834:1000:be24:11ff:fe06:d987/" && exit 0; n=$((n+1)); sleep 0.5; done; echo "fd33:5692:1834:1000:be24:11ff:fe06:d987 never became usable on eth0" >&2; exit 1'
