# Zones served by Pythia. Add a block here and a matching file in
# /var/lib/powerdns/zones, then: pdns_control rediscover

zone "home" {
    type master;
    file "/var/lib/powerdns/zones/home.zone";
};

zone "1.168.192.in-addr.arpa" {
    type master;
    file "/var/lib/powerdns/zones/1.168.192.in-addr.arpa.zone";
};

# Split-horizon override of a single public name - NOT the whole domain.
# Needs a forward-zone AND an addNTA() on Delphi; peetvandesande.com is signed.
zone "ca.peetvandesande.com" {
    type master;
    file "/var/lib/powerdns/zones/ca.peetvandesande.com.zone";
};
