# Pythia - authoritative for the lab's own zones.
#
# Only Delphi ever asks it anything (via forward-zones), and it never talks to
# the internet. Zone data is plain BIND-format files under
# /var/lib/powerdns/zones - no database to back up or corrupt.
#
# Managed from homelab/dns - edit there, not here.

# Two backends. bind holds the static zones from this repo. gsqlite3 holds
# the zones of whichever Proxmox lab is running (openstack.home and the
# 192.168.32.0/21 reverse zones), which the labs create and delete through
# the API - they come and go too often to live in git. The server answers
# from whichever backend has the most specific zone, so openstack.home in
# gsqlite3 sits inside home in bind without a delegation.
#
# gsqlite3 is listed first so that zones created through the API land there:
# the bind backend cannot create zones.
launch=gsqlite3,bind
bind-config=/etc/powerdns/bindbackend.conf
gsqlite3-database=/var/lib/powerdns/labs.sqlite3

# The ULA twin is published as pythia.home's AAAA. Only Delphi, ruby and
# jennie ever query this server, and all three can now do it over either
# family. The wait-for-address drop-in waits for both, DAD included.
local-address=192.168.8.52,fd33:5692:1834:1000:be24:11ff:fe06:d987
local-port=53

# Zone transfers are for Delphi's benefit only; nothing else needs them.
disable-axfr=no
allow-axfr-ips=192.168.8.51/32

# Internal names, internal zones - no point signing them.
# (If you ever want DNSSEC here, Delphi validates, so add a trust anchor too.)

# Loopback only: the authoritative server cannot serve TLS - it has no
# certificate settings at all. nginx terminates TLS on :8081 and proxies here,
# so webserver-allow-from only ever sees 127.0.0.1 and real access control
# lives in the nginx vhost.
webserver=yes
webserver-address=127.0.0.1
webserver-port=8181
webserver-allow-from=127.0.0.1
api=yes
api-key=@@AUTH_API_KEY@@

setuid=pdns
setgid=pdns
