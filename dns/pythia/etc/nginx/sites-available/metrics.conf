# TLS termination for the authoritative server webserver.
#
# None of the three PowerDNS components can serve TLS itself: the auth server
# and the recursor have no certificate settings at all, and dnsdist accepts
# `certificate`/`key` on setWebserverConfig and then silently serves plain
# HTTP. So the backend binds loopback and nginx fronts it.
#
# Listens on the wildcard rather than the static address on purpose - that is
# what lets it skip the wait-for-address drop-in the DNS listeners need.

server {
    listen 8081 ssl default_server;
    listen [::]:8081 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/homelab-tls/host.crt;
    ssl_certificate_key /etc/homelab-tls/host.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The backend's own ACL now only ever sees 127.0.0.1, so access control for
    # the outside world lives here. Same posture as before: Prometheus only.
    allow 192.168.8.53;
    allow 127.0.0.1;
    deny  all;

    location / {
        proxy_pass http://127.0.0.1:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The API, for the Proxmox labs: their playbooks register the lab's names
    # from lenora, which has a static address and trusts the lab CA. Access
    # rules in a location replace the server-level ones, so Prometheus keeps
    # what it had. The API key is still required.
    # Both of lenora's addresses: it prefers IPv6, and an allow list that
    # names only the IPv4 answers 403 to the labs (uc1-lab found this).
    location /api/ {
        allow 192.168.8.21;
        allow fd33:5692:1834:1000::21;
        allow 192.168.8.53;
        allow 127.0.0.1;
        deny  all;

        proxy_pass http://127.0.0.1:8181;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
