# Point node-exporter at its TLS config.
#
# An override of ExecStart rather than an edit to
# /etc/default/prometheus-node-exporter, because that file carries per-host
# collector flags ($ARGS differs between lenora and the containers) and this
# drop-in has to be byte-identical everywhere. Clearing ExecStart first is
# required - systemd appends otherwise and the unit refuses to start with two.
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter $ARGS --web.config.file=/etc/homelab-tls/node-exporter-web.yml
