# Point node-exporter at its TLS config.
#
# An override of ExecStart rather than an edit to
# /etc/default/prometheus-node-exporter, because that file carries per-host
# collector flags ($ARGS differs between lenora and the containers) and this
# drop-in has to be byte-identical everywhere. Clearing ExecStart first is
# required - systemd appends otherwise and the unit refuses to start with two.
#
# The textfile collector is on everywhere, for the same reason this drop-in is
# identical everywhere: a host-specific flag would belong in $ARGS instead. It
# is how jobs that are not services publish state to Prometheus - today
# vpn-domain-sync on themis. The directory is created by scripts/deploy.sh; an
# empty one costs nothing.
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter $ARGS --web.config.file=/etc/homelab-tls/node-exporter-web.yml --collector.textfile.directory=/var/lib/node_exporter/textfile
