# Managed from homelab/apt - do not edit here.
#
# needrestart is installed to REPORT, never to act. It ships an apt hook, and
# in automatic mode that hook would restart services during an unattended run -
# which is exactly the decision apt/CLAUDE.md invariant 3 keeps out of the
# timer. 'l' is list-only.
$nrconf{restart} = 'l';
# Do not prompt, ever: an unattended run has no tty to answer.
$nrconf{ucodehints} = 0;
1;
