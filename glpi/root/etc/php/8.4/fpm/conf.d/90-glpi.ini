; GLPI's settings, for php-fpm and the CLI alike (the role installs this file
; into both conf.d directories): its cron and console run under the CLI.

; Attachments and document uploads; nginx's client_max_body_size matches.
upload_max_filesize = 100M
post_max_size = 100M
memory_limit = 256M
max_execution_time = 300

; GLPI checks these and warns in its setup pages when they are off.
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Lax

; The host runs on UTC; each GLPI user picks a display timezone.
date.timezone = UTC
