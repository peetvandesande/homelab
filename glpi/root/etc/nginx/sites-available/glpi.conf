# GLPI on glpi, as itsm.sogode.com and glpi.home: from the LAN and VPN
# directly, from the internet via ruby, which admits only home and VPN ranges.
# The lab certificate carries both names. Binds the wildcard, so it needs no
# wait for the address at boot.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name itsm.sogode.com glpi.home;
    return 308 https://itsm.sogode.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name itsm.sogode.com glpi.home;

    ssl_certificate     /etc/homelab-tls/host.crt;
    ssl_certificate_key /etc/homelab-tls/host.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # To the journal, so Alloy ships them to Loki with the host's labels.
    access_log syslog:server=unix:/dev/log,tag=nginx_glpi,nohostname;
    error_log  syslog:server=unix:/dev/log,tag=nginx_glpi,nohostname;

    # Requests from ruby carry the real client in X-Forwarded-For. Trust it
    # from ruby's tunnel and dummy addresses only.
    set_real_ip_from 172.31.1.0/24;
    set_real_ip_from 192.168.254.0/24;
    set_real_ip_from fd33:5692:1834:ff01::/64;
    set_real_ip_from fd33:5692:1834:254::/64;
    real_ip_header   X-Forwarded-For;

    # Ticket attachments and document uploads; php's limits match.
    client_max_body_size 100m;

    root /opt/glpi/current/public;

    # The legacy REST API is for automation on this host alone (the loopback
    # server below), refused here however it is spelt. GLPI also refuses it
    # from anywhere but localhost by its API client list: two locks.
    location ~ ^(/index\.php)?/apirest\.php {
        return 403;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 300s;
    }
}

# Loopback only, plain HTTP: the REST API, for the Ansible role that sets up
# the mail collector. REMOTE_ADDR is 127.0.0.1, which is what GLPI's
# "full access from localhost" API client admits.
server {
    listen 127.0.0.1:8080;
    server_name localhost;

    access_log syslog:server=unix:/dev/log,tag=nginx_glpi_api,nohostname;
    error_log  syslog:server=unix:/dev/log,tag=nginx_glpi_api,nohostname;

    root /opt/glpi/current/public;

    location ~ ^/apirest\.php {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location / {
        return 404;
    }
}
