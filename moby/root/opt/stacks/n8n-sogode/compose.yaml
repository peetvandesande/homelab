# n8n for Sogode business use, at n8n.sogode.com. The same stack as
# ../n8n (n8n, Postgres, task runners, SearXNG and the Instance AI sandbox
# service), with its own data and secrets. Managed from homelab/moby - edit
# there, not in /opt/stacks/n8n-sogode.
#
# Published on loopback only, on 5680. The host's nginx terminates TLS for it
# (etc/nginx/sites-available/n8n-sogode.conf), and ruby proxies the public
# side to that nginx over wgclient1.
#
# Secrets are in .env beside this file, written on moby by deploy.sh and
# never in git. N8N_ENCRYPTION_KEY encrypts every stored credential: lose it
# and they are unreadable, so it goes wherever the database goes.
#
# Mail goes out as n8n@n8n.sogode.com, a mailbox on ruby, through ruby's
# submission port.
name: n8n-sogode

services:
  # The sandbox service for Instance AI: the workflow builder runs generated
  # code here. One release pins the API, runner and sandbox images. Nothing of
  # it is published; n8n reaches sandbox-api by name on this compose network.
  # The runner is privileged Docker-in-Docker - root-equivalent on moby.
  sandbox-certs:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.8.1
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner --world-readable &&
        chown -R sandbox-api:sandbox-api /tls/api && chmod -R a+rX /tls
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - sandbox-tls:/tls

  sandbox-api:
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.8.1
    restart: unless-stopped
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${SANDBOX_API_KEY:?run moby/scripts/deploy.sh}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_REGISTRATION_TOKEN:?run moby/scripts/deploy.sh}
      SANDBOX_API_RUNNER_API_KEY: ${SANDBOX_RUNNER_KEY:?run moby/scripts/deploy.sh}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - sandbox-tls:/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  sandbox-runner-1:
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:1.8.1
    restart: unless-stopped
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${SANDBOX_REGISTRATION_TOKEN}
      SANDBOX_RUNNER_API_KEYS: ${SANDBOX_RUNNER_KEY}
      SANDBOX_RUNNER_API_GRPC_ADDR: sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: https://sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.8.1
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - sandbox-tls:/tls:ro

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run moby/scripts/deploy.sh}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  # External task runners: Code-node JavaScript and Python run here, not in
  # the n8n process. Same version as n8n. They dial n8n's broker on 5679,
  # which stays on this network.
  runners:
    image: ghcr.io/n8n-io/runners:2.45.5
    restart: unless-stopped
    depends_on:
      - n8n
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?run moby/scripts/deploy.sh}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      # Idle runners exit and are relaunched on demand.
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: '15'

  # Web search for Instance AI. Internal only.
  searxng:
    image: ghcr.io/searxng/searxng:2026.9.8-3fdc6d753
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run moby/scripts/deploy.sh}
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro

  n8n:
    # Pinned: n8n ships often and its upgrades migrate the database. Bump this
    # on purpose, after reading the release notes.
    image: docker.n8n.io/n8nio/n8n:2.45.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5680:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run moby/scripts/deploy.sh}
      # One URL, both sides: on the LAN and the VPN this name is moby, outside
      # it is ruby. Webhook URLs shown in the editor are built from it, so it
      # must be the public name.
      N8N_HOST: n8n.sogode.com
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://n8n.sogode.com/
      N8N_EDITOR_BASE_URL: https://n8n.sogode.com/
      # Exactly one proxy is in front: moby's nginx. When a request came via
      # ruby, nginx has already replaced the address with the real client's
      # (real_ip in n8n.conf), so one hop is right for both paths.
      N8N_PROXY_HOPS: "1"
      N8N_METRICS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Invitations and password resets, out through ruby's submission port,
      # which the lab resolves to ruby's wg0 address.
      N8N_EMAIL_MODE: smtp
      N8N_SMTP_HOST: mail.peetvandesande.com
      N8N_SMTP_PORT: "587"
      N8N_SMTP_SSL: "false"
      N8N_SMTP_STARTTLS: "true"
      N8N_SMTP_USER: n8n@n8n.sogode.com
      N8N_SMTP_PASS: ${N8N_SMTP_PASS:?run moby/scripts/deploy.sh}
      N8N_SMTP_SENDER: n8n <n8n@n8n.sogode.com>
      # Code nodes run in the runners container, through this broker.
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_INSTANCE_AI_SEARXNG_URL: http://searxng:8080
      # Instance AI's workflow builder runs its code in the sandbox service.
      N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: n8n-sandbox
      N8N_INSTANCE_AI_SANDBOX_API_URL: http://sandbox-api:8080
      N8N_SANDBOX_SERVICE_URL: http://sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY: ${SANDBOX_API_KEY}
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
    volumes:
      - data:/home/node/.n8n

volumes:
  db:
  data:
  sandbox-tls:
