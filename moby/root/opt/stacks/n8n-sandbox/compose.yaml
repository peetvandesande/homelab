# n8n sandbox: a throwaway n8n for experiments and API clients, apart from the
# production stack. Managed from homelab/moby - edit there, not in
# /opt/stacks/n8n-sandbox.
#
# LAN and VPN only, as n8n-sandbox.home: nothing on ruby proxies to it, so
# its webhooks are not reachable from the internet. Plain HTTP, because n8n's
# clients do not trust the lab CA. Published on loopback behind moby's nginx.
#
# SQLite in the data volume, no mail. N8N_ENCRYPTION_KEY is in .env beside
# this file, generated by deploy.sh once.
name: n8n-sandbox

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:5679:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run moby/scripts/deploy.sh}
      N8N_HOST: n8n-sandbox.home
      N8N_PROTOCOL: http
      N8N_PORT: "5678"
      WEBHOOK_URL: http://n8n-sandbox.home/
      N8N_EDITOR_BASE_URL: http://n8n-sandbox.home/
      # The login cookie is Secure by default and a browser drops it over HTTP.
      N8N_SECURE_COOKIE: "false"
      # moby's nginx is the one proxy in front.
      N8N_PROXY_HOPS: "1"
      N8N_METRICS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
    volumes:
      - data:/home/node/.n8n

volumes:
  data:
