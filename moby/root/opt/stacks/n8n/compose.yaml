# n8n, the first stack on moby that this repo owns (moby/CLAUDE.md invariant 2).
# Managed from homelab/moby - edit there, not in /opt/stacks/n8n.
#
# Published on loopback only. The host's nginx terminates TLS for it
# (etc/nginx/sites-available/n8n.conf), and ruby proxies the public side to
# that nginx over wgclient1 - nothing reaches 5678 directly.
#
# Secrets are in .env beside this file, written on moby by deploy.sh and
# never in git. N8N_ENCRYPTION_KEY encrypts every stored
# credential: lose it and they are unreadable, so it goes wherever the
# database goes.
name: n8n

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run moby/scripts/deploy.sh}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    # Pinned: n8n ships often and its upgrades migrate the database. Bump this
    # on purpose, after reading the release notes.
    image: docker.n8n.io/n8nio/n8n:2.45.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run moby/scripts/deploy.sh}
      # One URL, both sides: on the LAN this name is moby (split-horizon,
      # dns/ansible), outside it is ruby. Webhook URLs shown in the editor are
      # built from it, so it must be the public name.
      N8N_HOST: n8n.peetvandesande.com
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      WEBHOOK_URL: https://n8n.peetvandesande.com/
      N8N_EDITOR_BASE_URL: https://n8n.peetvandesande.com/
      # Exactly one proxy is in front: moby's nginx. When a request came via
      # ruby, nginx has already replaced the address with the real client's
      # (real_ip in n8n.conf), so one hop is right for both paths.
      N8N_PROXY_HOPS: "1"
      N8N_METRICS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Invitations and password resets, out through ruby's submission port,
      # which the lab resolves to ruby's wg0 address.
      N8N_EMAIL_MODE: smtp
      N8N_SMTP_HOST: mail.peetvandesande.com
      N8N_SMTP_PORT: "587"
      N8N_SMTP_SSL: "false"
      N8N_SMTP_STARTTLS: "true"
      N8N_SMTP_USER: n8n@peetvandesande.com
      N8N_SMTP_PASS: ${N8N_SMTP_PASS:?run moby/scripts/deploy.sh}
      N8N_SMTP_SENDER: n8n <n8n@peetvandesande.com>
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
    volumes:
      - data:/home/node/.n8n

volumes:
  db:
  data:
