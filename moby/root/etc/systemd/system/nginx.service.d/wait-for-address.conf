# nginx binds 192.168.8.27:80 and :443 for n8n (sites-available/n8n.conf),
# not the wildcard, because Docker holds those ports on .73 and .74. In an LXC
# with ifupdown network-online.target is reached before eth0 has its address,
# so wait for it - otherwise nginx fails on a cold boot and takes the engine
# metrics on 9323 down with it. Same pattern as dns/, see the comment in
# dns/themis/etc/systemd/system/dnsdist.service.d/wait-for-address.conf.
#
# Unlike the dns/ units, the wait cannot simply be appended. The packaged
# ExecStartPre is `nginx -t`, and nginx -t opens the listening sockets, so it
# fails with "Cannot assign requested address" before an appended wait ever
# runs - which is what happened on the boot of 1 November 2026. So the empty
# ExecStartPre= clears the packaged one, the wait goes first, and the config
# test is restated after it, verbatim from /usr/lib/systemd/system/nginx.service.
#
# No IPv6 wait: the v6 listeners are the wildcard.
[Service]
ExecStartPre=
ExecStartPre=+/bin/sh -c 'n=0; while [ $n -lt 120 ]; do ip -4 addr show dev eth0 | grep -q "inet 192.168.8.27/" && exit 0; n=$((n+1)); sleep 0.5; done; echo "192.168.8.27 never appeared on eth0" >&2; exit 1'
ExecStartPre=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'
