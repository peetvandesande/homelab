# The Home Assistant site listens on 192.168.1.79 specifically, and nginx
# refuses to start with "cannot assign requested address" if that address is
# not on eth0 yet. homelab-extra-addresses.service puts it there; order nginx
# after it, and wait, because in an LXC with ifupdown network-online.target is
# reached before eth0 has any address at all.
#
# The leading "+" runs the check outside the unit's sandbox, as the DNS
# containers' drop-ins do - see dns/*/etc/systemd/system/*.d/.
[Unit]
Requires=homelab-extra-addresses.service
After=homelab-extra-addresses.service

[Service]
ExecStartPre=+/bin/sh -c 'n=0; while [ $n -lt 120 ]; do ip -4 addr show dev eth0 | grep -q "inet 192.168.1.79/" && exit 0; n=$((n+1)); sleep 0.5; done; echo "192.168.1.79 never appeared on eth0" >&2; exit 1'
