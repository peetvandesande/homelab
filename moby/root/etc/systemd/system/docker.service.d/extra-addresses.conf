# Containers publish on 192.168.1.73 and .74, so the engine must not start
# before those addresses exist. Requires=, not just After=: if the addresses
# fail to appear, a Docker that starts anyway brings every published container
# up broken, which is harder to spot than a Docker that did not start.
[Unit]
Requires=homelab-extra-addresses.service
After=homelab-extra-addresses.service
