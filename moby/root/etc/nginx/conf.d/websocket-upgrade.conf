# $connection_upgrade for the proxied websocket in sites-available/
# homeassistant.conf. It has to live in the http context, which on Debian
# means conf.d/ rather than a server block.
#
# "close" when the client did not ask to upgrade, "upgrade" when it did -
# hard-coding Connection: upgrade breaks ordinary requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
