# TLS termination for ntfy in the jobsearch-shared stack, on 127.0.0.1:5690,
# as ntfy.sogode.com. The phone reaches it through ruby (the public name is a
# CNAME to ruby), which proxies everything here over wg1; ntfy's own
# deny-all access control is what keeps topics private, not this vhost.
# moby's lab-CA certificate carries the name.

map $http_upgrade $ntfy_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 192.168.8.27:443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ntfy.sogode.com;

    ssl_certificate     /etc/homelab-tls/host.crt;
    ssl_certificate_key /etc/homelab-tls/host.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/ntfy-sogode.access.log;
    error_log  /var/log/nginx/ntfy-sogode.error.log;

    # As for n8n-sogode: trust X-Forwarded-For from ruby only.
    set_real_ip_from 172.31.1.0/24;
    set_real_ip_from 192.168.254.0/24;
    set_real_ip_from fd33:5692:1834:ff01::/64;
    set_real_ip_from fd33:5692:1834:254::/64;
    real_ip_header   X-Forwarded-For;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5690;
        proxy_http_version 1.1;
        # Subscriptions are websockets or long-lived HTTP streams.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $ntfy_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3h;
    }
}
