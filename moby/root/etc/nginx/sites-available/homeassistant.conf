# TLS for Home Assistant on 192.168.1.79.
#
# Home Assistant can read a certificate itself, but only from inside the
# container and only by rewriting configuration.yaml, which it also rewrites.
# The host nginx already holds the lab certificate for the engine metrics, so
# it fronts this too - the same "a service that cannot serve TLS itself gets
# an nginx in front of it" shape as the PowerDNS webservers.
#
# The certificate carries homeassistant.home and 192.168.1.79 as extra SANs;
# ca/scripts/enrol.sh names them (see FLEET).
#
# Listens on .79 specifically, not the wildcard: on this host the wildcard
# would also mean .73 and .74, where traefik already serves its own
# certificates for nextcloud and xwiki. That makes nginx depend on the address
# existing - homelab-extra-addresses.service puts it on eth0, and the drop-in
# in systemd/system/nginx.service.d makes nginx wait for it.
server {
    listen 192.168.1.79:443 ssl;
    http2 on;
    server_name homeassistant.home homeassistant 192.168.1.79;

    ssl_certificate     /etc/homelab-tls/host.crt;
    ssl_certificate_key /etc/homelab-tls/host.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Home Assistant is a websocket application first and an HTTP one second:
    # without the upgrade headers the UI loads and then sits there unable to
    # connect, which looks like a broken backend rather than a broken proxy.
    location / {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # These two only work because Home Assistant is set up for them:
        # 172.20.0.0/14 is a trusted proxy and use_x_forwarded_for is on,
        # both under Settings -> System -> Network. Those settings live in
        # .storage/http, NOT in configuration.yaml - 2026.9 migrated them and
        # ignores the YAML key. Turn them off there and every request through
        # here is answered with a bare 400 Bad Request.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A long-lived websocket must not be cut at the default 60s.
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
    }
}
