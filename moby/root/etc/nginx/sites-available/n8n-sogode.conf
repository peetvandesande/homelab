# TLS termination for the Sogode n8n stack (/opt/stacks/n8n-sogode), on
# 127.0.0.1:5680, as n8n.sogode.com: from the LAN and VPN directly, from the
# internet via ruby, which sends only webhook and form paths. moby's lab-CA
# certificate carries the name.

map $http_upgrade $n8n_sogode_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 192.168.8.27:80;
    listen [::]:80;
    server_name n8n.sogode.com;
    return 308 https://n8n.sogode.com$request_uri;
}

server {
    listen 192.168.8.27:443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name n8n.sogode.com;

    ssl_certificate     /etc/homelab-tls/host.crt;
    ssl_certificate_key /etc/homelab-tls/host.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/n8n-sogode.access.log;
    error_log  /var/log/nginx/n8n-sogode.error.log;

    # Requests from ruby carry the real client in X-Forwarded-For. Trust it
    # from ruby's tunnel and dummy addresses only, so $remote_addr is the real
    # client from here on - for the log, and for n8n, which then needs exactly
    # one proxy hop whichever way the request came.
    set_real_ip_from 172.31.1.0/24;
    set_real_ip_from 192.168.254.0/24;
    set_real_ip_from fd33:5692:1834:ff01::/64;
    set_real_ip_from fd33:5692:1834:254::/64;
    real_ip_header   X-Forwarded-For;

    # Workflow payloads and binary data; n8n's own default limit is 16M.
    client_max_body_size 16m;

    # For Prometheus only, like the engine metrics on 9323 - by both of its
    # addresses, since n8n.sogode.com has an AAAA and a client that prefers IPv6
    # arrives from the ULA.
    location = /metrics {
        allow 192.168.8.53;
        allow fd33:5692:1834:1000:be24:11ff:fe65:ad6b;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:5680;
    }

    location / {
        proxy_pass http://127.0.0.1:5680;
        proxy_http_version 1.1;
        # The editor's push channel is a websocket.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $n8n_sogode_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        # Long-running webhook responses and the push channel.
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
