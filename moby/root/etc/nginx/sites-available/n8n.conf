# TLS termination for the n8n stack (/opt/stacks/n8n), on 127.0.0.1:5678.
#
# Two kinds of client arrive here, both by the name n8n.peetvandesande.com:
#   - the LAN, directly: split-horizon resolves the name to moby;
#   - the internet, via ruby, which proxies over wgclient1 and sends only the
#     webhook and form paths (homelab/moby/ruby).
# The certificate is moby's lab-CA one, which carries this name as a SAN.
#
# IPv4 is bound to moby's own address, not the wildcard: Docker already holds
# :80 and :443 on .73 and .74 for nextcloud and traefik, and Linux will not
# let a wildcard listener share a port with a specific one. That is why nginx
# has a wait-for-address drop-in (nginx.service.d) - a specific address can
# lose the cold-boot race in an ifupdown LXC (../CLAUDE.md). IPv6 is the
# wildcard: nothing else listens on v6 here, and nginx sets ipv6only on
# [::] listeners, so it never collides with the v4 binds.

map $http_upgrade $n8n_connection_upgrade {
    default upgrade;
    ''      close;
}

# default_server: an unknown name on moby's address gets production n8n, as
# before the sandbox, whichever file nginx happens to load first.
server {
    listen 192.168.8.27:80 default_server;
    listen [::]:80 default_server;
    server_name n8n.peetvandesande.com n8n.home;
    return 308 https://n8n.peetvandesande.com$request_uri;
}

server {
    listen 192.168.8.27:443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name n8n.peetvandesande.com n8n.home;

    ssl_certificate     /etc/homelab-tls/host.crt;
    ssl_certificate_key /etc/homelab-tls/host.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/n8n.access.log;
    error_log  /var/log/nginx/n8n.error.log;

    # Requests from ruby carry the real client in X-Forwarded-For. Trust it
    # from ruby's tunnel and dummy addresses only, so $remote_addr is the real
    # client from here on - for the log, and for n8n, which then needs exactly
    # one proxy hop whichever way the request came.
    set_real_ip_from 172.31.1.0/24;
    set_real_ip_from 192.168.254.0/24;
    set_real_ip_from fd33:5692:1834:ff01::/64;
    set_real_ip_from fd33:5692:1834:254::/64;
    real_ip_header   X-Forwarded-For;

    # Workflow payloads and binary data; n8n's own default limit is 16M.
    client_max_body_size 16m;

    # For Prometheus only, like the engine metrics on 9323 - by both of its
    # addresses, since n8n.home has an AAAA and a client that prefers IPv6
    # arrives from the ULA.
    location = /metrics {
        allow 192.168.8.53;
        allow fd33:5692:1834:1000:be24:11ff:fe65:ad6b;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:5678;
    }

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        # The editor's push channel is a websocket.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $n8n_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        # Long-running webhook responses and the push channel.
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
