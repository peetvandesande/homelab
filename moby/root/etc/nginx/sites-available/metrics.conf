# TLS termination for the Docker Engine's own metrics.
#
# dockerd serves /metrics as plain HTTP and has no certificate settings at
# all, so the engine binds 127.0.0.1:9324 (daemon.json, metrics-addr) and
# nginx fronts it here on 9323 - the port Prometheus expects for a Docker
# engine, so the scrape config reads like everyone else's.
#
# Listens on the wildcard rather than the static address on purpose: that is
# what lets it skip the wait-for-address drop-in a service bound to
# 192.168.1.27 would need in an ifupdown LXC.

server {
    listen 9323 ssl default_server;
    listen [::]:9323 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/homelab-tls/host.crt;
    ssl_certificate_key /etc/homelab-tls/host.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The engine's listener is loopback-only, so access control for the
    # outside world lives here. Prometheus only, same as the DNS boxes.
    allow 192.168.1.53;
    allow 127.0.0.1;
    deny  all;

    location / {
        proxy_pass http://127.0.0.1:9324;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
