# The n8n sandbox (/opt/stacks/n8n-sandbox, on 127.0.0.1:5679), in plain
# HTTP: n8n's clients do not trust the lab CA. LAN and VPN only - nothing on
# the internet resolves or proxies to this name.
#
# :443 only redirects, so an https:// link lands here rather than on
# production n8n, the default server on this address.

server {
    listen 192.168.8.27:80;
    listen [::]:80;
    server_name n8n-sandbox.home;

    access_log /var/log/nginx/n8n-sandbox.access.log;
    error_log  /var/log/nginx/n8n-sandbox.error.log;

    client_max_body_size 16m;

    # Prometheus only, by both of its addresses.
    location = /metrics {
        allow 192.168.8.53;
        allow fd33:5692:1834:1000:be24:11ff:fe65:ad6b;
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:5679;
    }

    location / {
        proxy_pass http://127.0.0.1:5679;
        proxy_http_version 1.1;
        # The editor's push channel is a websocket.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $n8n_connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}

server {
    listen 192.168.8.27:443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name n8n-sandbox.home;

    ssl_certificate     /etc/homelab-tls/host.crt;
    ssl_certificate_key /etc/homelab-tls/host.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 308 http://n8n-sandbox.home$request_uri;
}
