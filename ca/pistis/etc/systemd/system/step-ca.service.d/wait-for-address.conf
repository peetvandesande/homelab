# In an LXC with ifupdown, network-online.target is reached before eth0
# actually has its address, so a service binding to a specific IP can lose the
# race. step-ca binds 192.168.1.55:8443 explicitly (ca.json "address"), so it
# is exposed to exactly this - it exits with "cannot assign requested address"
# and Restart=on-failure then burns the start limit before the address lands.
#
# The leading "+" runs this outside the unit's sandbox: RestrictAddressFamilies
# blocks the AF_NETLINK socket "ip" needs, and the check would otherwise fail
# with "Cannot open netlink socket".
[Service]
ExecStartPre=+/bin/sh -c 'n=0; while [ $n -lt 120 ]; do ip -4 addr show dev eth0 | grep -q "inet 192.168.1.55/" && exit 0; n=$((n+1)); sleep 0.5; done; echo "192.168.1.55 never appeared on eth0" >&2; exit 1'
