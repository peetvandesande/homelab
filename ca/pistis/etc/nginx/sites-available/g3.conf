# Publishes the CA's public files over plain HTTP at /g3/.
#
# Plain HTTP is correct here and not an oversight. These are the files a client
# needs *in order to* establish trust, so requiring TLS to fetch them is a
# chicken-and-egg problem; they are all signed objects that verify on their own.
#
# NOTE: the URLs inside the G3 certificate name ca.peetvandesande.com, not this
# host - see intermediate/g3-ext.cnf. Pistis is the origin that holds the files;
# it is not necessarily what answers that name. Inside the lab it is, by
# split-horizon on Pythia. Outside, the name is a CNAME to ruby, which reverse-
# proxies /g3/ back here over wg1 - nothing is synced, so the two views cannot
# drift. ca/ruby/ holds that vhost. ca.peetvandesande.com is in server_name
# because both paths arrive carrying it as the Host header.
#
# /g2/ is NOT served here. It belongs to the pre-G3 hierarchy, its one file
# never changes between revocations, and ruby serves it statically from
# /var/www/ca.g2 - see ca/ruby/. This host is G3 only.
#
# Listens on the wildcard rather than 192.168.8.55 on purpose - that is what
# lets it skip the wait-for-address drop-in that step-ca needs.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ca.peetvandesande.com pistis.home ca.home _;

    root /var/www;
    autoindex off;

    # The /g3/ path is named in the G3 certificate's crlDistributionPoints and
    # authorityInfoAccess, so it is baked into every certificate the root has
    # signed under it. The path cannot be renamed later, wherever it is hosted.
    location /g3/ {
        autoindex on;
        default_type application/octet-stream;
        types {
            application/pkix-cert  crt;
            application/pkix-crl   crl;
            application/x-pem-file pem;
        }
        # A CRL that clients cache for a week is a revocation that takes a week
        # to land. Keep it short; these files are tiny.
        add_header Cache-Control "public, max-age=300";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 302 /g3/;
    }
}
