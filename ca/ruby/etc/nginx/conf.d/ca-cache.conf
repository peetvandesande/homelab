# Cache for the /g3/ files proxied from pistis. Managed in homelab/ca/ruby;
# installed by ca/scripts/install-ruby.sh. /g2/ is static and needs none.
#
# The cache is not for speed - these files are a few kB and fetched rarely.
# It is what makes the proxy safe to depend on. ruby answers the only copy of
# these URLs that anything off the LAN can reach, and the origin is at the far
# end of a WireGuard tunnel to a home fibre line. Without a cache, an hour of
# home downtime is an hour in which every outside client fails to build a
# chain or check revocation.
#
# inactive is 30d, not the usual minutes: an entry must survive a long outage
# to be worth having. max_size is nominal - all of /g3/ is under 10kB.
proxy_cache_path /var/cache/nginx/ca levels=1:2 keys_zone=ca:1m
                 max_size=16m inactive=30d use_temp_path=off;
