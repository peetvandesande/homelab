# Managed by proxmox/ in the homelab repo - edit there, not on lenora.
#
# The router is the LAN's NTP server (router/README.md), so lenora takes time
# from it rather than the Debian pool. Every container's clock is lenora's.
# By IP: time must not depend on DNS being up.
server 192.168.8.1 iburst

sourcedir /run/chrony-dhcp
sourcedir /etc/chrony/sources.d
keyfile /etc/chrony/chrony.keys
driftfile /var/lib/chrony/chrony.drift
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
maxupdateskew 100.0
rtcsync
makestep 1 3
leapseclist /usr/share/zoneinfo/leap-seconds.list
confdir /etc/chrony/conf.d

# Serve time to the Proxmox labs (uc1-lab's Talos nodes sync from this
# host). An allow directive only opens the server side; the sources above
# are untouched, so the router stays the only one.
allow 192.168.32.0/21
