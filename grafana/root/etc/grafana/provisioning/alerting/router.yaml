# The router and the XGS-PON stick in it. Neither can run node-exporter, so
# lenora collects both over SSH into its textfile collector
# (homelab/router-metrics) - they arrive on lenora's `node` target as
# homelab_router_* and homelab_ont_*. Managed from homelab/grafana.
#
# These alerts go out through Home Assistant's push relay, over the same
# Orange line the ONT carries: an ONT that is actually down delivers nothing
# until the line is back. The Healthchecks.io heartbeat is what reports that
# from outside; these are the record, and catch the degradations that do not
# take the line down.
apiVersion: 1

groups:
  - orgId: 1
    name: router
    folder: Homelab
    interval: 1m
    rules:
      - uid: ont-not-operational
        title: "ONT not operational"
        condition: B
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The ONT has left PLOAM state O5.1 - no data path to Orange"
          description: >-
            Any state but 51 means the stick is not passing traffic. Check Rx power on the Router and ONT dashboard, then router/ORANGE.md, 'Diagnosing the PON'. This reaches the phone only once the line is back.
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "@@PROM_DS_UID@@"
            model:
              editorMode: code
              expr: 'homelab_ont_ploam_state == bool 51'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: lt
                    params: [1]
      - uid: ont-rx-power-low
        title: "ONT receive power low"
        condition: B
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "ONT Rx power is {{ $values.A }} dBm"
          description: >-
            Healthy is about -19 dBm. Ranging broke at -23 dBm on 7 October 2026 while the stick raised no alarm of its own. Clean or reseat the SC connector before it drops - router/ORANGE.md.
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "@@PROM_DS_UID@@"
            model:
              editorMode: code
              expr: 'homelab_ont_rx_power_dbm'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: lt
                    params: [-21]
      - uid: ont-hot
        title: "ONT running hot"
        condition: B
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The XGS-PON stick is at {{ $values.A }} C"
          description: >-
            It runs about 60 C under load; the router's fan only starts at 70 C (router/ORANGE.md, open item 3).
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "@@PROM_DS_UID@@"
            model:
              editorMode: code
              expr: 'homelab_ont_temperature_celsius'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params: [75]
      - uid: ont-unreachable
        title: "ONT not answering"
        condition: B
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The router reaches the ONT no longer"
          description: >-
            lenora reaches the router, but the router's forced-command key on the stick returns nothing. The stick's management (192.168.11.1 on eth1.2) or its authorized_keys - rerun router-metrics/scripts/deploy.sh. Says nothing about the PON itself.
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "@@PROM_DS_UID@@"
            model:
              editorMode: code
              expr: 'homelab_ont_up and on() homelab_router_metrics_up == 1'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: lt
                    params: [1]
      - uid: router-metrics-stale
        title: "Router metrics not collected"
        condition: B
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "lenora has not collected from the router for 10 minutes"
          description: >-
            homelab-router-metrics.timer on lenora, or its key on the router (forced to /usr/local/bin/router-metrics). Without it the ONT and Wi-Fi alerts here are blind. Rerun router-metrics/scripts/deploy.sh after a router factory reset.
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "@@PROM_DS_UID@@"
            model:
              editorMode: code
              expr: '(time() - homelab_router_metrics_timestamp_seconds) + (1 - homelab_router_metrics_up) * 1e6'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params: [300]
      - uid: ipv6-prefix-missing
        title: "No IPv6 prefix from Orange"
        condition: B
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Orange has not delegated an IPv6 prefix"
          description: >-
            The LAN has only its ULA and both WireGuard tunnels, whose endpoints are IPv6, are down. After a firmware upgrade this was the IAID - check network.wan6.reqprefix is 56:1 (router/ORANGE.md, 'The IAID trap').
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "@@PROM_DS_UID@@"
            model:
              editorMode: code
              expr: 'homelab_router_ipv6_prefix_delegated'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: lt
                    params: [1]
      # The only rule here on a log line rather than a metric, because this
      # fault has no metric: the MLO station table leaks inside the driver and
      # nothing counts it. See the description, and grafana/CLAUDE.md
      # invariant 11 for why the threshold is what it is.
      - uid: wifi-sta-table-stale
        title: "Wi-Fi station table has stale entries"
        condition: B
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "A radio's station table holds entries the driver cannot find"
          description: >-
            hostapd lists a station the mt7990 driver has no record of, so that client's link is half-registered and may pass no traffic while still looking associated. One leaked entry is about 1 error per minute, since router-metrics polls get_clients once a minute and each stale entry fails once per poll; the band is the BN index in the line, BN1 being 5GHz. It leaks on an MLO teardown - look for 'INVALID setup_link_id' around the onset. Clear it with `wifi reload` on the router, which restarts the radios without taking the WAN and the ONT down; a reboot also works but costs the line. Caused an evening of unusable Wi-Fi on 21 October 2026, undetected for 9.5 hours.
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "@@LOKI_DS_UID@@"
            model:
              datasource:
                type: loki
                uid: "@@LOKI_DS_UID@@"
              editorMode: code
              expr: 'sum(count_over_time({host="router"} |= "sta not found" [10m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params: [5]
      # The rule that would have caught 23 October 2026, when the WAN kept its
      # address, its route and PLOAM 51 while receiving nothing for 75 minutes.
      # Every other signal looked healthy, which is why this one thresholds
      # arriving bytes instead: a live WAN always receives something, so zero
      # over five minutes is wrong whatever the cause. router/ORANGE.md,
      # "A dead session behind a live interface".
      - uid: wan-receiving-nothing
        title: "WAN receiving nothing"
        condition: B
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Nothing has arrived on the WAN for five minutes, though the interface is up"
          description: >-
            The router still holds its lease, its default route and an operational PON, and is transmitting - but nothing is coming back. This is the one-way dead session that follows a PON re-registration: netifd sees no ifdown, because eth1.832 never loses carrier, so udhcpc never rebinds and the lease stays valid for days. wan-watchdog should already have forced an ifup; if this is still firing, check `logread | grep wan-watchdog` on the router and run `ifup wan` by hand. This alert travels over the line it reports on, so it reaches the phone only once the line is back - the Healthchecks.io heartbeat is what reports it live.
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "@@PROM_DS_UID@@"
            model:
              editorMode: code
              expr: 'increase(homelab_router_wan_bytes_total{direction="rx"}[5m])'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: lt
                    params: [1]
      # A LODS recovers on its own in under a minute and leaves PLOAM back at
      # 51, so 'ONT not operational' (for: 2m) never sees it. It is still worth
      # knowing about, because one of these is what killed the session on
      # 23 October 2026 - it is the warning that the line flapped, not that it
      # is down. The uptime term suppresses the one every reboot causes: the
      # stick is powered by the router's SFP cage, so it resyncs whenever the
      # router restarts, and its counters reset with it
      # (router-metrics/CLAUDE.md invariant 5).
      - uid: ont-downstream-sync-lost
        title: "ONT lost downstream sync"
        condition: B
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "The ONT logged a loss of downstream sync - the PON flapped"
          description: >-
            The stick lost downstream synchronisation and re-ranged. It normally returns to PLOAM 51 within a minute, so the line looks fine again by the time you read this - but the Orange session may not have survived it. Check that the WAN is still receiving ('WAN receiving nothing' is the rule for that) and look at Rx power on the Router and ONT dashboard: a marginal upstream loops this way, assigning an ONU-ID and never ranging. router/ORANGE.md, 'Diagnosing the PON'.
        noDataState: OK
        execErrState: Alerting
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: "@@PROM_DS_UID@@"
            model:
              editorMode: code
              expr: 'increase(homelab_ont_lods_events_total[15m]) * (homelab_router_uptime_seconds > bool 900)'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params: [0]
      # The second rule here on a log line rather than a metric, for the same
      # reason as wifi-sta-table-stale: the router cannot run node-exporter, so
      # a script on it has no textfile collector to publish to. Without this,
      # a watchdog that fixes the fault in two minutes fixes it silently and
      # nobody learns the line flapped. See wan-watchdog/CLAUDE.md.
      - uid: wan-watchdog-acting
        title: "WAN watchdog forced a restart"
        condition: B
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "wan-watchdog found the WAN dead and forced a fresh DHCP exchange"
          description: >-
            The watchdog on the router probed out of the WAN device, got nothing for three consecutive sweeps while netifd still reported the interface up, and ran `ifup wan wan6`. If connectivity came back, this is the dead-session failure being repaired automatically - note it and look for a LODS at the same time. If it keeps firing, the ifup is not fixing it: the backoff doubles to 30 minutes, so repeated firings mean a genuinely broken line rather than a stale session. `logread | grep wan-watchdog` on the router has the sequence.
        noDataState: OK
        execErrState: OK
        isPaused: false
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: "@@LOKI_DS_UID@@"
            model:
              datasource:
                type: loki
                uid: "@@LOKI_DS_UID@@"
              editorMode: code
              expr: 'sum(count_over_time({host="router", identifier="wan-watchdog"} |= "forcing" [30m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  evaluator:
                    type: gt
                    params: [0]
