# Where alerts go: Home Assistant, which pushes them to the phone.
# Managed from homelab/grafana.
#
# The contact point is a plain webhook into a Home Assistant automation
# (homelab/homeassistant/automations/grafana-alerts.yaml), which turns each
# notification into a push via the companion app: critical alerts as iOS
# critical notifications, which break through Do Not Disturb and silent mode,
# warnings as ordinary ones. HA does the formatting, so Grafana sends its
# standard webhook payload untemplated.
#
# @@HA_WEBHOOK_ID@@ is substituted by scripts/deploy.sh from secrets.env. The
# webhook id is the only credential an HA webhook has, so it stays out of the
# repo and the deployed file is 0640 root:grafana. The automation also sets
# local_only, so the URL is useless from outside the LAN.
#
# The URL is an IP on purpose, not merely by the lab's habit: delivery must not
# depend on DNS, or a "DNS component down" alert - the outage that most needs
# reporting - could not be delivered. Same reasoning as homelab-tls-renew. HA's
# certificate carries the IP SAN and Grafana's host trusts the lab CA, so this
# is still verified TLS.
#
# Everything here goes through the home internet connection: HA reaches the
# phone via the companion app's push relay. A home outage therefore cannot be
# reported from here - that is what the heartbeat is for (heartbeat.yaml): a
# rule that always fires, routed to Healthchecks.io, which alerts from outside
# when it stops. @@HEALTHCHECKS_PING_URL@@ is substituted the same way as the
# webhook id; anyone holding it can fake the heartbeat.
#
# Provisioning the policy tree replaces whatever was set in the UI.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: home-assistant
    receivers:
      - uid: home-assistant-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: "https://192.168.8.90/api/webhook/@@HA_WEBHOOK_ID@@"
          httpMethod: POST
  - orgId: 1
    name: healthchecks
    receivers:
      - uid: healthchecks-ping
        type: webhook
        # A resolve is a POST too, and Healthchecks.io would count it as a
        # ping - so the heartbeat stopping would look like it carrying on.
        disableResolveMessage: true
        settings:
          url: "@@HEALTHCHECKS_PING_URL@@"
          httpMethod: POST

  # The alert responder on lexie (homelab/responder): an AI agent that
  # investigates read-only and pushes its finding to the phone. Plain HTTP on
  # the LAN with a bearer token; @@RESPONDER_TOKEN@@ is substituted by
  # scripts/deploy.sh from responder/secrets.env. Which alerts it acts on is
  # decided there, not here (responder/root/etc/responder/allowed-alerts).
  - orgId: 1
    name: responder
    receivers:
      - uid: responder-webhook
        type: webhook
        disableResolveMessage: true
        settings:
          url: "http://192.168.8.24:9095/alert"
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: "@@RESPONDER_TOKEN@@"

policies:
  - orgId: 1
    receiver: home-assistant
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    # Warnings repeat twice a day while they last; criticals more often, and
    # are sent sooner.
    repeat_interval: 12h
    routes:
      # The heartbeat, first so nothing else claims it. Sent at once and
      # re-sent every 5 minutes for as long as it fires; the check on
      # Healthchecks.io expects one every 5 with 10 minutes' grace.
      - receiver: healthchecks
        object_matchers:
          - [heartbeat, "=", "true"]
        group_wait: 0s
        group_interval: 1m
        repeat_interval: 5m
      # A copy of every alert goes to the responder, then on to the routes
      # below as before. After the heartbeat, which does not continue.
      - receiver: responder
        continue: true
        object_matchers:
          - [alertname, "=~", ".+"]
        group_wait: 30s
        repeat_interval: 12h
      - receiver: home-assistant
        object_matchers:
          - [severity, "=", critical]
        group_wait: 10s
        repeat_interval: 4h
