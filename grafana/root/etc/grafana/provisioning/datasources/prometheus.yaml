# Prometheus datasource. Managed from homelab/grafana.
#
# https now, because Prometheus serves TLS off the lab CA. Grafana verifies it
# against the system trust store, into which ca/scripts/enrol.sh installed the
# G2 root - so tlsSkipVerify stays false and this is a real check, not theatre.
#
# The URL is an IP, not prometheus.home. .home resolves since the DHCP cutover
# to Themis, and the certificate carries a DNS SAN beside its IP SAN, so the
# name would verify too - the IP is a choice now, not a constraint.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: https://192.168.8.53:9090
    isDefault: true
    jsonData:
      tlsSkipVerify: false
