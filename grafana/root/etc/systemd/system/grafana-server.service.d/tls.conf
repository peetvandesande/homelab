# Serve the UI over HTTPS, and let Grafana read the key.
#
# Environment variables rather than edits to /etc/grafana/grafana.ini: that
# file is ~2000 lines of packaged defaults, all of it currently untouched, and
# owning a copy here would mean re-merging it on every Grafana upgrade. GF_*
# variables override the ini and are the documented way to do this.
[Service]
Environment=GF_SERVER_PROTOCOL=https
Environment=GF_SERVER_CERT_FILE=/etc/homelab-tls/host.crt
Environment=GF_SERVER_CERT_KEY=/etc/homelab-tls/host.key
SupplementaryGroups=tlscert
