# Managed from homelab/navidrome - edit there, not on 192.168.1.61.
#
# Plain HTTP on 4533, deliberately. Media streaming is LAN-only, and Navidrome
# has a single listener - TLSCert/TLSKey would switch the UI to HTTPS too, and
# every client pointed at http://...:4533 would stop working. Prometheus
# scrapes /metrics on this same plain port; put an nginx in front if that ever
# needs to be TLS again.
DataFolder = "/var/lib/navidrome"
MusicFolder = "/var/media/music"

[Prometheus]
Enabled = true
MetricsPath = "/metrics"
