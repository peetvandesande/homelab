# Managed from homelab/navidrome - edit there, not on 192.168.1.61.
#
# TLSCert/TLSKey switch port 4533 from HTTP to HTTPS in place; there is no
# second port and no redirect, so any client still using http://...:4533 stops
# working rather than being redirected. That is the trade for a single port.
DataFolder = "/var/lib/navidrome"
MusicFolder = "/var/media/music"

TLSCert = "/etc/homelab-tls/host.crt"
TLSKey = "/etc/homelab-tls/host.key"

[Prometheus]
Enabled = true
MetricsPath = "/metrics"
