# forgejo-runner on lexie (forgejo-runner/scripts/deploy.sh installs it).
# Host jobs only, under the label `lexie`: a job runs as the forgejo-runner
# user, directly on lexie. That user has no group beyond its own and no key
# but one: moby accepts it from lexie only and forces it to
# /usr/local/sbin/jobsearch-schema (moby/scripts/deploy.sh). Its jobs'
# secrets are in /etc/forgejo-runner/jobsearch.env. Registered for peet's
# repositories only (forgejo/scripts/deploy.sh), not instance-wide.
log:
  level: info
  job_level: info
runner:
  capacity: 1            # one job at a time: two deploys never overlap
  timeout: 30m
  shutdown_timeout: 5m
  insecure: false
  fetch_timeout: 30s
  fetch_interval: 5s
  labels: ["lexie:host"]
cache:
  enabled: false
host:
  workdir_parent: /var/lib/forgejo-runner/work
server:
  # The UUID is derived from the shared secret (the first 16 characters as
  # bytes, as Forgejo does), so deploy.sh fills it in; the token itself is
  # the secret, handed over by systemd (LoadCredential in the unit).
  connections:
    forgejo:
      url: https://git.sogode.com/
      uuid: "@@RUNNER_UUID@@"
      token_url: file:$CREDENTIALS_DIRECTORY/token
