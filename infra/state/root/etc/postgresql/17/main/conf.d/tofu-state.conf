# Forgejo's PostgreSQL also holds OpenTofu's state, for people and the deploy
# runner to share, so it listens on the LAN address as well as loopback and
# presents the host's lab certificate. Forgejo itself still uses loopback.
listen_addresses = 'localhost,192.168.8.62'
ssl_cert_file = '/etc/homelab-tls/host.crt'
ssl_key_file = '/etc/homelab-tls/host.key'
