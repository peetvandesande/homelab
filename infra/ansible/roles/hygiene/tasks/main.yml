---
- name: Mask units that have no place on these hosts
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: true
  loop: "{{ hygiene_units }}"

# Masking leaves an already-failed state in place, and a failed unit is what the
# systemd-unit-failed alert fires on.
- name: Clear any failed state left on those units
  ansible.builtin.command: systemctl reset-failed {{ item }}
  loop: "{{ hygiene_units }}"
  changed_when: false
  failed_when: false
