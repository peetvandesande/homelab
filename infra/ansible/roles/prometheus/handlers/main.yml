---
- name: Apply the ping range
  ansible.builtin.command: sysctl -q -p /etc/sysctl.d/60-ping-group-range.conf
  changed_when: true

- name: Restart the blackbox exporter
  ansible.builtin.systemd_service:
    name: prometheus-blackbox-exporter
    state: restarted
    daemon_reload: true

# A restart can report failure while the outgoing process still holds its
# listener, and Restart=on-failure then brings it back. The role asks Prometheus
# itself afterwards, which is the check that counts.
- name: Restart Prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
    daemon_reload: true
  failed_when: false
