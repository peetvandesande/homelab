---
# Checked first, so a bad rule set fails the run and the running one stays.
- name: Apply the firewall
  ansible.builtin.shell:
    cmd: |
      set -e
      nft -c -f /etc/nftables.conf
      systemctl restart nftables
  changed_when: true

- name: Restart Ollama
  ansible.builtin.systemd_service:
    name: ollama
    state: restarted
    daemon_reload: true

- name: Restart the GPU exporter
  ansible.builtin.systemd_service:
    name: nvidia-gpu-exporter
    state: restarted
    daemon_reload: true
