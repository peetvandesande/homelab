---
# Security reboots: lenora, ruby and jennie only (apt_security_reboot_hosts).
- name: Install the reboot check and its timers
  ansible.builtin.copy:
    src: "{{ apt_security_source }}/{{ item.path }}"
    dest: "/{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: usr/local/sbin/homelab-security-reboot, mode: "0755" }
    - { path: etc/systemd/system/homelab-security-reboot.service, mode: "0644" }
    - { path: etc/systemd/system/homelab-security-reboot.timer, mode: "0644" }
    - { path: etc/systemd/system/homelab-security-reboot-verify.service, mode: "0644" }
    - { path: etc/systemd/system/homelab-security-reboot-verify.timer, mode: "0644" }

- name: Install the action log it records to
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../scripts/action-log"
    dest: /usr/local/bin/action-log
    owner: root
    group: root
    mode: "0755"

- name: Create the timer's drop-in and the settings directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/systemd/system/homelab-security-reboot.timer.d
    - /etc/homelab

- name: Set this host's time
  ansible.builtin.copy:
    content: |
      [Timer]
      OnCalendar=*-*-* {{ apt_security_reboot.at }}:00 Europe/Paris
    dest: /etc/systemd/system/homelab-security-reboot.timer.d/time.conf
    owner: root
    group: root
    mode: "0644"

# Root only: on ruby and jennie it holds the OVH key. Lists are quoted, so the
# file is safe to source in a shell as well as read by systemd.
- name: Install its settings
  ansible.builtin.copy:
    content: |
      MODE={{ apt_security_reboot.mode }}
      LATEST={{ apt_security_reboot.latest }}
      BACKUP={{ apt_security_reboot.backup }}
      UNITS="{{ apt_security_reboot.units }}"
      INTERFACES="{{ apt_security_reboot.interfaces | default('') }}"
      PEER_PROBES="{{ apt_security_reboot.peer_probes | default('') }}"
      ACTION_COMMIT={{ lookup('ansible.builtin.pipe', 'git -C ' ~ role_path ~ ' rev-parse HEAD') }}
      {% if apt_security_reboot.backup == 'ovh' %}
      OVH_SERVICE={{ apt_security_reboot.ovh_service }}
      {{ apt_security_ovh }}
      {% endif %}
    dest: /etc/homelab/security-reboot.env
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Keep the reboot check and the after-boot check on
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - homelab-security-reboot.timer
    - homelab-security-reboot-verify.timer
