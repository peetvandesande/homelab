---
responder_source: "{{ role_path }}/../../../../responder/root"
responder_private: "{{ lookup('ansible.builtin.env', 'HOMELAB_PRIVATE') | default(lookup('ansible.builtin.env', 'HOME') ~ '/projects/homelab-private', true) }}"
responder_secrets: "{{ lookup('ansible.builtin.file', responder_private ~ '/responder/secrets.env') }}"
responder_token: "{{ responder_secrets | regex_search('(?m)^RESPONDER_TOKEN=(.*)$', '\\1') | first }}"
responder_ha_webhook_id: "{{ responder_secrets | regex_search('(?m)^HA_WEBHOOK_ID=(.*)$', '\\1') | first }}"
