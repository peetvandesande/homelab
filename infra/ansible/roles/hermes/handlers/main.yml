---
- name: Restart Docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
    daemon_reload: true

- name: Restart postfix
  ansible.builtin.command:
    chdir: /opt/mailcow-dockerized
    cmd: docker compose restart postfix-mailcow
  changed_when: true

- name: Restart Rspamd
  ansible.builtin.command:
    chdir: /opt/mailcow-dockerized
    cmd: docker compose restart rspamd-mailcow
  changed_when: true
