---
# Checked before it is installed; ruby has no provider firewall, so this file is
# the only filtering it has. Run with --check --diff first: anything changed by
# hand on ruby and not brought back here shows up as a difference.
- name: Install the firewall
  ansible.builtin.copy:
    src: "{{ outside_host_repo }}/wireguard/ruby/nftables.conf"
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: nft -c -f %s
  notify: Load the firewall

- name: Create the report's settings directory
  ansible.builtin.file:
    path: /etc/estate-report
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the estate report
  ansible.builtin.copy:
    src: "{{ outside_host_repo }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: estate-report/root/usr/local/bin/estate-report, dest: /usr/local/bin/estate-report, mode: "0755" }
    - { src: ca/rootca/certs/root.crt, dest: /etc/estate-report/lab-root.crt, mode: "0644" }
    - { src: estate-report/root/etc/systemd/system/estate-report.service, dest: /etc/systemd/system/estate-report.service, mode: "0644" }
    - { src: estate-report/root/etc/systemd/system/estate-report.timer, dest: /etc/systemd/system/estate-report.timer, mode: "0644" }
  loop_control:
    label: "{{ item.dest }}"

- name: Keep the report's timer on
  ansible.builtin.systemd_service:
    name: estate-report.timer
    enabled: true
    state: started
    daemon_reload: true

# The public sites: each reverse-proxies a lab service over wg1, with a Let's
# Encrypt certificate, and verifies the origin against the lab root. Listing a
# site in outside_host_vhosts publishes it; its public name must already point
# here, or the certificate cannot be issued.
- name: Install the lab root the sites verify their origins against
  ansible.builtin.copy:
    src: "{{ outside_host_repo }}/ca/rootca/certs/root.crt"
    dest: /etc/nginx/homelab-root-g2.crt
    owner: root
    group: root
    mode: "0644"

# The editors and admin pages read it; it belongs to ruby's own setup.
- name: Check the admin allow list is there
  ansible.builtin.stat:
    path: /etc/nginx/snippets/home-lan-allow.conf
  register: outside_host_allow
  failed_when: not outside_host_allow.stat.exists or outside_host_allow.stat.size == 0

# certonly with the nginx authenticator answers http-01 through the running nginx
# and edits no config, so each site stays exactly what is in git. The deploy hook
# is kept in the renewal config.
- name: Issue the sites' certificates
  ansible.builtin.command:
    cmd: >-
      certbot certonly --nginx -n --keep-until-expiring -d {{ item.name }}
      --deploy-hook "systemctl reload nginx"
    creates: "/etc/letsencrypt/live/{{ item.name }}/fullchain.pem"
  loop: "{{ outside_host_vhosts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install the sites
  ansible.builtin.copy:
    src: "{{ outside_host_repo }}/{{ item.src }}"
    dest: "/etc/nginx/sites-available/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ outside_host_vhosts }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload nginx

- name: Enable the sites
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item.name }}"
    dest: "/etc/nginx/sites-enabled/{{ item.name }}"
    state: link
    force: "{{ ansible_check_mode }}"
  loop: "{{ outside_host_vhosts }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload nginx

# Forgejo's SSH on the public :22. Only once ruby's own sshd has left the public
# addresses, which forgejo/scripts/install-ruby-ssh.sh does with a rollback timer:
# before that, nginx could not bind :22.
- name: Find out whether the public :22 is Forgejo's
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/10-vpn-only.conf
  register: outside_host_vpn_only_ssh

- name: Pass the public :22 to Forgejo
  ansible.builtin.copy:
    src: "{{ outside_host_repo }}/forgejo/ruby/etc/nginx/stream.d/forgejo-ssh.conf"
    dest: /etc/nginx/stream.d/forgejo-ssh.conf
    owner: root
    group: root
    mode: "0644"
  when: outside_host_vpn_only_ssh.stat.exists
  notify: Reload nginx

- name: Take retired sites down
  ansible.builtin.file:
    path: "/etc/nginx/{{ item[1] }}/{{ item[0] }}"
    state: absent
  loop: "{{ outside_host_retired_vhosts | product(['sites-enabled', 'sites-available']) | list }}"
  loop_control:
    label: "{{ item[1] }}/{{ item[0] }}"
  notify: Reload nginx

# After the reload, so nginx never points at a certificate that has gone.
- name: Flush the reload before removing their certificates
  ansible.builtin.meta: flush_handlers

- name: Remove retired sites' certificates
  ansible.builtin.command:
    cmd: certbot delete -n --cert-name {{ item }}
    removes: "/etc/letsencrypt/renewal/{{ item }}.conf"
  loop: "{{ outside_host_retired_vhosts }}"
