---
# install_recommends off: the recommended collectors package adds its own apt
# textfile timer, and homelab-apt-textfile (apt/) is what publishes that here.
- name: Install node-exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    install_recommends: false

# 0755: every job that writes here runs as root.
- name: Create the textfile collector directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile
    state: directory
    owner: root
    group: prometheus
    mode: "0755"

- name: Create its drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Bind it to this host's tunnel address
  vars:
    ADDR: "{{ outside_addr }}"  # noqa: var-naming[pattern]
  ansible.builtin.template:
    src: "{{ outside_host_repo }}/outside/{{ item.src }}"
    dest: "/{{ item.src }}"
    variable_start_string: "@@"
    variable_end_string: "@@"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: etc/default/prometheus-node-exporter }
    - { src: etc/systemd/system/prometheus-node-exporter.service.d/outside.conf }
  loop_control:
    label: "{{ item.src }}"
  notify: Restart node-exporter

- name: Keep node-exporter enabled and running
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
