---
# The role asks Loki itself afterwards, which is the check that counts.
- name: Restart Loki
  ansible.builtin.systemd_service:
    name: loki
    state: restarted
    daemon_reload: true
  failed_when: false

# router.alloy sits beside the fleet's config.alloy and only parses as a pair.
# The unit is active before its components have started, so the check is the
# listener itself.
- name: Restart Alloy with the router listener
  ansible.builtin.shell:
    cmd: |
      set -e
      alloy validate /etc/alloy >/dev/null
      systemctl restart alloy
      for _ in $(seq 10); do [ -n "$(ss -Huln 'sport = :1514')" ] && exit 0; sleep 1; done
      echo "alloy is not listening on :1514" >&2
      exit 1
    executable: /bin/bash
  changed_when: true
