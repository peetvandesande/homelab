---
# The two Actions runners and the alert responder. Always run by a person: this
# restarts the runners, so it must not run from a job on one of them. Forgejo must
# be up, since each runner registers with it. From infra/ansible:
#
#   ansible-playbook ci.yml --check --diff
- name: Lexie
  hosts: lexie
  gather_facts: false
  force_handlers: true
  any_errors_fatal: true
  roles:
    - responder
    - role: forgejo_runner
      vars:
        forgejo_runner_source: "{{ playbook_dir }}/../../forgejo-runner/root"
        forgejo_runner_scope: peet
        forgejo_runner_token_value: "{{ lookup('ansible.builtin.file', forgejo_runner_private ~ '/forgejo/secrets.env') | regex_search('(?m)^RUNNER_LEXIE_SECRET=(.*)$', '\\1') | first }}"
  tasks:
    - name: Keep what the job search deploy needs
      ansible.builtin.import_tasks: roles/forgejo_runner/tasks/lexie_jobs.yml

- name: Talos
  hosts: talos
  gather_facts: false
  force_handlers: true
  any_errors_fatal: true
  roles:
    - talos
    - role: forgejo_runner
      vars:
        forgejo_runner_source: "{{ playbook_dir }}/../../talos/root"
        forgejo_runner_scope: peet/homelab
