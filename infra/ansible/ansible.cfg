# Self-contained: run ansible from this directory and it finds everything.
[defaults]
inventory          = inventory/fleet.py
remote_user        = root
forks              = 16
host_key_checking  = True
interpreter_python = auto_silent
result_format      = yaml

[ssh_connection]
pipelining = True
# Host keys are pinned in ./known_hosts, so this behaves the same for a person
# and for a CI runner, and never trusts a key it has not been given. The path
# is relative to the working directory, which is why ansible must run from here.
ssh_args   = -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts -o GlobalKnownHostsFile=/dev/null -o HostKeyAlgorithms=ssh-ed25519 -o ControlMaster=auto -o ControlPath=/tmp/.infra-%C -o ControlPersist=60s
