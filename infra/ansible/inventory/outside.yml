---
# ruby and jennie, which only a person runs against: outside.yml says how. Kept apart
# from fleet.py so nothing that targets the fleet can ever reach them.
all:
  children:
    outside:
      hosts:
        ruby:
          ansible_host: 192.168.254.254
          outside_addr: 192.168.254.254
        jennie:
          ansible_host: 192.168.254.2
          outside_addr: 192.168.254.2
      vars:
        ansible_user: peet
        ansible_become: true
        # Login takes a second factor Ansible cannot answer, so it reuses the
        # session the person opened with `ssh -M`, at this socket. Replaces
        # ansible.cfg's ssh_args for these two hosts only; its ControlPath would
        # otherwise point at a socket nobody opened.
        ansible_ssh_args: >-
          -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile=known_hosts -o GlobalKnownHostsFile=/dev/null
          -o HostKeyAlgorithms=ssh-ed25519 -o ControlMaster=auto -o ControlPath=~/.ssh/cm-%r@%h:%p
          -o ControlPersist=10m
