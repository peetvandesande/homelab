# Managed in homelab/outside; outside.yml fills in @@ADDR@@.
#
# The exporter binds dummy0's address, so wait for it. The leading "+" runs the
# check outside the unit's sandbox, where "ip" can open netlink.
[Service]
ExecStartPre=+/bin/sh -c 'n=0; while [ $n -lt 120 ]; do ip addr show dev dummy0 | grep -q "inet @@ADDR@@/" && exit 0; n=$((n+1)); sleep 0.5; done; echo "@@ADDR@@ never appeared on dummy0" >&2; exit 1'
