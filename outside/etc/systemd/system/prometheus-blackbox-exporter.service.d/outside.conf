# Managed in homelab/outside; install.sh fills in @@ADDR@@.
#
# The exporter binds dummy0's address, so wait for it, as the DNS stack does
# for eth0 (dns/*/etc/systemd/system/*.d/wait-for-address.conf). The leading
# "+" runs the check outside the unit's sandbox, where "ip" can open netlink.
#
# CAP_NET_RAW lets the icmp module open raw sockets rather than depend on
# net.ipv4.ping_group_range admitting the service user.
[Service]
ExecStartPre=+/bin/sh -c 'n=0; while [ $n -lt 120 ]; do ip addr show dev dummy0 | grep -q "inet @@ADDR@@/" && exit 0; n=$((n+1)); sleep 0.5; done; echo "@@ADDR@@ never appeared on dummy0" >&2; exit 1'
AmbientCapabilities=CAP_NET_RAW
CapabilityBoundingSet=CAP_NET_RAW
