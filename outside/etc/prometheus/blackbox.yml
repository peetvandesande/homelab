# blackbox_exporter modules for ruby and jennie, which probe each other's
# public side. Managed in homelab/outside; installed by install.sh.
#
# Targets are public IP literals, never names: both servers' BIND answers
# mail., ruby.peetvandesande.com and sogode.com with ruby's tunnel addresses
# (wireguard/, split-horizon), so a probe by name would test the tunnel, not
# the internet. So each site has its own module carrying the Host header and
# TLS server name, and redirects are not followed - following one would
# resolve a name.
#
# HTTP probes use HEAD wherever the status is the whole check: a GET of
# sogode.com's front page is 72 KB, every 2 minutes over each family. Two stay
# GET: Forgejo answers HEAD on /api/healthz with 404, and the n8n webhook
# probes match the body, which HEAD does not return.
modules:
  icmp:
    prober: icmp
    timeout: 5s

  # Port 25 as another mail server sees it: banner, EHLO, STARTTLS and a
  # certificate for mail.peetvandesande.com. A server that stops offering
  # STARTTLS answers 502 instead of 220 and fails the probe.
  smtp_mail:
    prober: tcp
    timeout: 15s
    tcp:
      tls_config:
        server_name: mail.peetvandesande.com
      query_response:
        - expect: "^220 "
        - send: "EHLO probe.peetvandesande.com\r"
        - expect: "^250 "
        - send: "STARTTLS\r"
        - expect: "^220"
        - starttls: true
        - send: "QUIT\r"

  https_sogode:
    prober: http
    timeout: 10s
    http:
      method: HEAD
      headers:
        Host: sogode.com
      tls_config:
        server_name: sogode.com
      fail_if_not_ssl: true
      no_follow_redirects: true
      valid_status_codes: [200]

  https_ruby:
    prober: http
    timeout: 10s
    http:
      method: HEAD
      headers:
        Host: ruby.peetvandesande.com
      tls_config:
        server_name: ruby.peetvandesande.com
      fail_if_not_ssl: true
      no_follow_redirects: true
      valid_status_codes: [200]

  # The lab CA's published files, as a client off the LAN sees them - ruby
  # reverse-proxies them from pistis over wg1 (homelab/ca/ruby). Plain HTTP on
  # purpose, and the probe asserts that: these URLs are frozen into
  # certificates as http://, and no_follow_redirects plus a strict 200 is what
  # catches somebody adding an http-to-https redirect on ruby and silently
  # breaking every CRL fetcher that speaks no TLS.
  #
  # This probe fails when the home line or wg1 is down for longer than ruby's
  # cache holds, which is the honest signal: that is exactly when an outside
  # client cannot check revocation either.
  http_ca:
    prober: http
    timeout: 10s
    http:
      method: HEAD
      headers:
        Host: ca.peetvandesande.com
      no_follow_redirects: true
      valid_status_codes: [200]

  # No site at the root: nginx answers 404, and that is the healthy answer.
  # The probe is for reachability and the certificate.
  https_peetvandesande:
    prober: http
    timeout: 10s
    http:
      method: HEAD
      headers:
        Host: peetvandesande.com
      tls_config:
        server_name: peetvandesande.com
      fail_if_not_ssl: true
      no_follow_redirects: true
      valid_status_codes: [404]

  # Forgejo through ruby. /api/healthz is answered by Forgejo itself after it
  # has checked its database, so a 200 means ruby, wg1, forgejo and Postgres.
  https_git:
    prober: http
    timeout: 10s
    http:
      headers:
        Host: git.peetvandesande.com
      tls_config:
        server_name: git.peetvandesande.com
      fail_if_not_ssl: true
      no_follow_redirects: true
      valid_status_codes: [200]

  # n8n through ruby. No workflow is registered at this path, so n8n itself
  # answers 404 saying so - which only happens if the request reached it.
  # nginx's own 404, or a 502 from a dead tunnel, does not carry that text.
  https_n8n_webhook:
    prober: http
    timeout: 10s
    http:
      headers:
        Host: n8n.peetvandesande.com
      tls_config:
        server_name: n8n.peetvandesande.com
      fail_if_not_ssl: true
      no_follow_redirects: true
      valid_status_codes: [404]
      fail_if_body_not_matches_regexp: ["not registered"]

  # The editor must refuse the internet. 403 is ruby's allow list doing its
  # job; anything else - above all a 200 - fails.
  https_n8n_editor_closed:
    prober: http
    timeout: 10s
    http:
      method: HEAD
      headers:
        Host: n8n.peetvandesande.com
      tls_config:
        server_name: n8n.peetvandesande.com
      fail_if_not_ssl: true
      no_follow_redirects: true
      valid_status_codes: [403]

  # The same two checks for the Sogode n8n.
  https_n8n_sogode_webhook:
    prober: http
    timeout: 10s
    http:
      headers:
        Host: n8n.sogode.com
      tls_config:
        server_name: n8n.sogode.com
      fail_if_not_ssl: true
      no_follow_redirects: true
      valid_status_codes: [404]
      fail_if_body_not_matches_regexp: ["not registered"]

  # The editor must refuse the internet. 403 is ruby's allow list doing its
  # job; anything else - above all a 200 - fails.
  https_n8n_sogode_editor_closed:
    prober: http
    timeout: 10s
    http:
      method: HEAD
      headers:
        Host: n8n.sogode.com
      tls_config:
        server_name: n8n.sogode.com
      fail_if_not_ssl: true
      no_follow_redirects: true
      valid_status_codes: [403]
