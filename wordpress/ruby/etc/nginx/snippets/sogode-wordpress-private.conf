# sogode.com's WordPress login and XML-RPC, closed to the internet.
# Managed in homelab/wordpress; installed by wordpress/scripts/install-ruby.sh.
#
# Included inside the vhost's `location /`, so these nested locations inherit
# its proxy_set_header lines. proxy_pass is not inherited and is repeated.
#
# Only the owner logs in, from the VPN or the tunnels. Everyone else gets 403:
# outside traffic to both paths was password guessing. Jetpack's connection
# runs over XML-RPC and is given up with it.
location = /wp-login.php {
    include snippets/home-lan-allow.conf;
    deny all;
    proxy_pass http://localhost:19080;
}

location = /xmlrpc.php {
    include snippets/home-lan-allow.conf;
    deny all;
    proxy_pass http://localhost:19080;
}
