; Forgejo configuration. Managed from homelab/forgejo - edit there, not on
; forgejo. deploy.sh pushes it root:git 0640, so Forgejo can read it and
; cannot rewrite it: every setting that matters is here, and the web installer
; is locked out.
;
; No secret is in this file. Each one is read from /etc/forgejo/secrets/ by a
; *_URI key, and deploy.sh generates them on the host the first time. Losing
; them is not harmless: SECRET_KEY encrypts 2FA secrets and stored
; credentials in the database, so restore them with the database or not at all.

APP_NAME = Forgejo
RUN_USER = git
RUN_MODE = prod
WORK_PATH = /var/lib/forgejo

[server]
; One URL, both sides. On the LAN git.peetvandesande.com resolves here
; (split-horizon, dns/ansible); outside it is ruby, which proxies to this
; host over wgclient1. Clone URLs, webhooks and OAuth redirects are built
; from it, so it must be the public name and nothing else.
DOMAIN = git.peetvandesande.com
ROOT_URL = https://git.peetvandesande.com/
PROTOCOL = https
; Empty, not the default 0.0.0.0, which is IPv4 only. Empty makes the
; listener ":443", Go's dual-stack wildcard, so forgejo answers on its ULA and
; GUA as well, and there is no address to wait for at boot. Not "::": the main
; listener accepts it, but the :80 redirector glues address and port together
; as a string, gets ":::80" and exits the whole process.
HTTP_ADDR =
HTTP_PORT = 443
CERT_FILE = /etc/homelab-tls/host.crt
KEY_FILE = /etc/homelab-tls/host.key
; :80 answers with a redirect to :443, on the same wildcard.
REDIRECT_OTHER_PORT = true
PORT_TO_REDIRECT = 80
; git over SSH goes through the host's OpenSSH on :22, not Forgejo's built-in
; server: sshd_config.d/forgejo.conf asks Forgejo for the key per login, so
; there is no authorized_keys file to keep in step.
DISABLE_SSH = false
START_SSH_SERVER = false
SSH_DOMAIN = git.peetvandesande.com
SSH_PORT = 22
SSH_CREATE_AUTHORIZED_KEYS_FILE = false
LFS_START_SERVER = true
LFS_JWT_SECRET_URI = file:/etc/forgejo/secrets/lfs_jwt_secret
OFFLINE_MODE = true

[database]
; Peer authentication over the Unix socket: the role is named after the OS
; user, so there is no password anywhere.
DB_TYPE = postgres
HOST = /run/postgresql
NAME = forgejo
USER = git
SSL_MODE = disable

[repository]
ROOT = /var/lib/forgejo/repositories
; Public-facing, so a new repository is private until someone says otherwise.
DEFAULT_PRIVATE = private

[security]
INSTALL_LOCK = true
SECRET_KEY_URI = file:/etc/forgejo/secrets/secret_key
INTERNAL_TOKEN_URI = file:/etc/forgejo/secrets/internal_token
; ruby is the only proxy, and it reaches this host over wgclient1 from its
; tunnel or dummy addresses. Trusting X-Forwarded-For from those, and only
; those, is what puts the real client in the log rather than ruby.
REVERSE_PROXY_LIMIT = 1
REVERSE_PROXY_TRUSTED_PROXIES = 172.31.1.0/24,192.168.254.0/24,fd33:5692:1834:ff01::/64,fd33:5692:1834:254::/64
LOGIN_REMEMBER_DAYS = 14

[oauth2]
JWT_SECRET_URI = file:/etc/forgejo/secrets/jwt_secret

[service]
; Reachable from the internet. Accounts are made by an admin.
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
DEFAULT_KEEP_EMAIL_PRIVATE = true

[mailer]
; Nothing to send through: hermes relays only for the Proxmox labs and
; delivers nothing outside them (hermes/CLAUDE.md).
ENABLED = false

[session]
PROVIDER = db
COOKIE_SECURE = true

[log]
; To stdout, so to the journal, so to Loki.
MODE = console
LEVEL = Info

[metrics]
; Open on the LAN like node-exporter. Not reachable from outside: ruby's vhost
; refuses /metrics before proxying.
ENABLED = true

[cron.update_checker]
ENABLED = false
