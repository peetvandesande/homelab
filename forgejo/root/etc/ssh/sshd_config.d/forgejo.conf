# git over SSH, for Forgejo. Managed from homelab/forgejo.
#
# OpenSSH asks Forgejo for the key on every login as git, so there is no
# authorized_keys file to rewrite or drift: a key added in the web UI works on
# the next push. Forgejo prints the forced `forgejo serv` command with it.
# root keeps its own authorized_keys, untouched.
Match User git
    AuthorizedKeysCommandUser git
    AuthorizedKeysCommand /usr/local/bin/forgejo keys -c /etc/forgejo/app.ini -e git -u %u -t %t -k %k
    PasswordAuthentication no
    AllowTcpForwarding no
    X11Forwarding no
    PermitTTY no

# The internet reaches this sshd through ruby: its public :22 is an nginx
# stream proxy to here (ruby/etc/nginx/stream.d/), so every outside
# connection arrives from ruby's own tunnel addresses - the same ranges as
# REVERSE_PROXY_TRUSTED_PROXIES in app.ini. From those only git may log in.
Match Address 172.31.1.0/24,192.168.254.0/24,fd33:5692:1834:ff01::/64,fd33:5692:1834:254::/64
    AllowUsers git
