# Postgres here listens on the LAN address as well as loopback, for OpenTofu's
# state (listen_addresses in conf.d/tofu-state.conf). In an LXC with ifupdown,
# network-online.target is reached before eth0 has its address, so after a cold
# boot Postgres started first, could not bind the LAN address, said nothing and
# ran on loopback only. Forgejo, which uses loopback, kept working while every
# OpenTofu run failed with "connection refused". Observed on 19 November 2026
# after a power cut.
#
# Wait for the address before starting. The leading "+" runs this outside the
# unit's sandbox. After 60 seconds carry on regardless: Forgejo's own database
# matters more than the state database, so a missing address must not keep
# Postgres down.
[Service]
ExecStartPre=+/bin/sh -c 'n=0; while [ $n -lt 120 ]; do ip -4 addr show dev eth0 | grep -q "inet 192.168.8.62/" && exit 0; n=$((n+1)); sleep 0.5; done; echo "192.168.8.62 never appeared on eth0; starting without it" >&2; exit 0'
