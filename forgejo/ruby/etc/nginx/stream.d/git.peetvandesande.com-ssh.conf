# git over SSH for git.peetvandesande.com: ruby's public :22 is Forgejo's.
# Managed in homelab/forgejo/ruby; installed by forgejo/scripts/install-ruby-ssh.sh,
# which also moves ruby's own sshd onto its VPN addresses - nothing else may
# hold the public :22.
#
# Plain TCP, so the SSH session is end to end with forgejo and the host key
# clients see is forgejo's, the same as on the LAN. Forgejo sees every outside
# connection from ruby's tunnel address and allows only git from there
# (forgejo/root/etc/ssh/sshd_config.d/forgejo.conf).

server {
    listen 145.239.73.18:22;
    listen [2001:41d0:305:2100::1:3a0e]:22;

    # Resolved per connection, as in the https vhost: a name that fails at
    # load would stop all of nginx.
    resolver 127.0.0.1 valid=30s;
    resolver_timeout 3s;
    set $forgejo_ssh forgejo.home:22;
    proxy_pass $forgejo_ssh;

    proxy_connect_timeout 5s;
    # Idle limit, not a session limit: a large clone can sit quiet while
    # forgejo packs.
    proxy_timeout 1h;
}
