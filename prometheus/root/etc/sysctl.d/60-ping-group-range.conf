# Managed from homelab/prometheus. Lets the blackbox exporter's icmp module use
# unprivileged ICMP echo sockets, IPv4 and IPv6 alike.
#
# The obvious fix, AmbientCapabilities=CAP_NET_RAW, does nothing here: the
# package's setcap leaves an empty file-capability xattr on the binary in this
# unprivileged container (getcap shows "="), and executing a file that carries
# file capabilities discards ambient ones. So: every group, as systemd
# upstream defaults to - echo sockets can do nothing raw sockets could be
# abused for. Not systemd's "0 2147483647": in a user namespace the range may
# hold only mapped gids, and this container maps 0-65535.
net.ipv4.ping_group_range = 0 65535
