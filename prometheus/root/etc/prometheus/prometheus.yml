# Prometheus configuration. Managed from homelab/prometheus - edit there, not
# on 192.168.8.53.
#
# Targets are static and hand-maintained, so they rot when a service moves.
# They have been wrong before: the `node` job scraped .50/.51 as
# "jellyfin"/"navidrome" long after both moved to .60/.61. If you renumber
# anything, grep this file.
#
# TLS: every job below that carries `scheme: https` is talking to a service
# holding a certificate from the lab's own CA (homelab/ca). Targets stay as IP
# addresses rather than names. That was forced before the DHCP cutover to
# Themis and is now a choice: .home resolves, and every certificate carries a
# DNS SAN beside its IP SAN, so a name would verify.

global:
  scrape_interval:     30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
  - static_configs:
    - targets: ['localhost:9093']

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Note on the repetition below: `tls_config` is spelled out in full on each
# job rather than hoisted into a YAML anchor. Prometheus parses this file
# strictly and rejects any unrecognised top-level key, so an anchor block fails
# with "field tls_defaults not found in type config.plain". Four copies of two
# lines is the price.
#
# The root is named explicitly rather than relying on the system trust store,
# so a scrape cannot start silently trusting some unrelated public CA.

scrape_configs:
  # Prometheus scraping itself, now over TLS. 'localhost' is in this host's
  # certificate SANs precisely so this job keeps working without a DNS lookup.
  - job_name: 'prometheus'
    scheme: https
    tls_config:
      ca_file: /etc/homelab-tls/root_ca.crt
    static_configs:
      - targets: ['localhost:9090']

  # Every enrolled host. Keep in step with FLEET in ca/scripts/enrol.sh - a
  # host there but not here is unmonitored, and a host here but not enrolled
  # will fail once node-exporter goes TLS.
  - job_name: node
    scheme: https
    tls_config:
      ca_file: /etc/homelab-tls/root_ca.crt
    static_configs:
      - targets: ['lenora.home:9100']
        labels: {role: pve-host }
      - targets: ['moby.home:9100']
        labels: {role: moby }
      - targets: ['themis.home:9100']
        labels: {role: themis }
      - targets: ['delphi.home:9100']
        labels: {role: delphi }
      - targets: ['pythia.home:9100']
        labels: {role: pythia }
      - targets: ['prometheus.home:9100']
        labels: {role: prometheus }
      - targets: ['grafana.home:9100']
        labels: {role: grafana }
      - targets: ['pistis.home:9100']
        labels: {role: pistis }
      - targets: ['loki.home:9100']
        labels: {role: loki }
      - targets: ['hermes.home:9100']
        labels: {role: hermes }
      - targets: ['jellyfin.home:9100']
        labels: {role: jellyfin }
      - targets: ['navidrome.home:9100']
        labels: {role: navidrome }
      - targets: ['lexie.home:9100']
        labels: {role: lexie }
      - targets: ['forgejo.home:9100']
        labels: {role: forgejo }

  # Alloy, the log shipper, on every enrolled host (homelab/alloy). Same fourteen
  # targets as `node` - keep the two lists identical; a host in one and not
  # the other is either unmonitored or unlogged.
  - job_name: alloy
    scheme: https
    tls_config:
      ca_file: /etc/homelab-tls/root_ca.crt
    static_configs:
      - targets: ['lenora.home:12345']
        labels: {role: pve-host }
      - targets: ['moby.home:12345']
        labels: {role: moby }
      - targets: ['themis.home:12345']
        labels: {role: themis }
      - targets: ['delphi.home:12345']
        labels: {role: delphi }
      - targets: ['pythia.home:12345']
        labels: {role: pythia }
      - targets: ['prometheus.home:12345']
        labels: {role: prometheus }
      - targets: ['grafana.home:12345']
        labels: {role: grafana }
      - targets: ['pistis.home:12345']
        labels: {role: pistis }
      - targets: ['loki.home:12345']
        labels: {role: loki }
      - targets: ['hermes.home:12345']
        labels: {role: hermes }
      - targets: ['jellyfin.home:12345']
        labels: {role: jellyfin }
      - targets: ['navidrome.home:12345']
        labels: {role: navidrome }
      - targets: ['lexie.home:12345']
        labels: {role: lexie }
      - targets: ['forgejo.home:12345']
        labels: {role: forgejo }

  # Known broken, and not a TLS problem: prometheus-pve-exporter is not running
  # on 127.0.0.1:9221. Pre-existing.
  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
      cluster: ['1']
      node: ['1']
    static_configs:
      - targets: ['lenora.home']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9221

  # Jellyfin's UI is plain HTTP on 8096 (LAN-only media); 8920 is the same
  # process serving HTTPS alongside it, kept purely so this scrape can be TLS.
  - job_name: jellyfin
    scheme: https
    tls_config:
      ca_file: /etc/homelab-tls/root_ca.crt
    static_configs:
      - targets: ['jellyfin.home:8920']

  # Plain HTTP on purpose: Navidrome has one listener serving both the UI and
  # /metrics, and the UI is deliberately unencrypted (homelab/navidrome).
  - job_name: navidrome
    static_configs:
      - targets: ['navidrome.home:4533']

  # The Docker Engine on moby. The engine serves /metrics as plain HTTP on
  # 127.0.0.1:9324 and cannot do TLS itself, so nginx on the container fronts
  # it on 9323 - the usual engine metrics port - and allows only this host.
  - job_name: docker
    scheme: https
    tls_config:
      ca_file: /etc/homelab-tls/root_ca.crt
    static_configs:
      - targets: ['moby.home:9323']
        labels: {role: moby }

  # Traefik, on moby's .74. Plain HTTP on purpose: the dashboard entrypoint
  # serves /metrics and the whole thing is a migrated stack that predates this
  # repo's TLS posture - it keeps its own certificates for the sites it
  # fronts. Put it behind nginx like the engine metrics if that changes.
  - job_name: traefik
    static_configs:
      - targets: ['traefik.home:8080']
        labels: {role: moby }

  # Forgejo serves /metrics itself, on the same :443 as everything else, off
  # the lab certificate. Open on the LAN like node-exporter; ruby refuses the
  # path, so it is not reachable from outside (homelab/forgejo).
  - job_name: forgejo
    scheme: https
    tls_config:
      ca_file: /etc/homelab-tls/root_ca.crt
    static_configs:
      - targets: ['forgejo.home:443']
        labels: {role: forgejo }

  # n8n on moby (N8N_METRICS). The stack publishes 5678 on loopback only, so
  # this goes through moby's nginx, which allows /metrics to this host alone.
  - job_name: n8n
    scheme: https
    tls_config:
      ca_file: /etc/homelab-tls/root_ca.crt
    static_configs:
      - targets: ['n8n.home:443']
        labels: {role: moby }

  # The Sogode business n8n on moby, through the same nginx. By its public
  # name, which resolves to moby inside the lab.
  - job_name: n8n-sogode
    scheme: https
    tls_config:
      ca_file: /etc/homelab-tls/root_ca.crt
    static_configs:
      - targets: ['n8n.sogode.com:443']
        labels: {role: moby }

  # Loki exposes its own metrics on the same TLS port as its API.
  - job_name: loki
    scheme: https
    tls_config:
      ca_file: /etc/homelab-tls/root_ca.crt
    static_configs:
      - targets: ['loki.home:3100']

  # Grafana's own metrics. Not for pretty graphs: grafana_alerting_* is the only
  # thing that can tell you the alerting itself has stopped working, and a rule
  # naming a datasource uid that no longer exists fails silently rather than
  # erroring. Without this job, every other alert here is unmonitored.
  - job_name: grafana
    scheme: https
    tls_config:
      ca_file: /etc/homelab-tls/root_ca.crt
    static_configs:
      - targets: ['grafana.home:3000']
        labels: {role: grafana }

  # TLS, terminated by nginx on each DNS container. None of the three PowerDNS
  # components can serve TLS itself, so the backend binds loopback and nginx
  # fronts it on the same port this job has always used - the target addresses
  # did not change. nginx allows only .53, so these URLs return 403 from
  # anywhere else, which is intentional.
  - job_name: dns
    scheme: https
    tls_config:
      ca_file: /etc/homelab-tls/root_ca.crt
    static_configs:
      - targets: ['themis.home:8083']
        labels: {role: themis, component: dnsdist }
      - targets: ['delphi.home:8082']
        labels: {role: delphi, component: recursor }
      - targets: ['pythia.home:8081']
        labels: {role: pythia, component: auth }

  # Probes from inside the lab, by the blackbox exporter on this host
  # (blackbox.yml, 127.0.0.1:9115 - plain HTTP on loopback, so no TLS). `kind`
  # is what the rules in grafana/.../alerting/probes.yaml select on.
  - job_name: blackbox
    metrics_path: /probe
    static_configs:
      # The internet, two unrelated providers per family: one failing is theirs,
      # both failing is ours.
      - targets: ['1.1.1.1', '8.8.8.8']
        labels: {kind: internet, family: v4, __param_module: icmp }
      - targets: ['2606:4700:4700::1111', '2001:4860:4860::8888']
        labels: {kind: internet, family: v6, __param_module: icmp }
      # The tunnels, by the far end's dummy0 - the addresses services use.
      - targets: ['192.168.254.254']
        labels: {kind: tunnel, peer: ruby, family: v4, __param_module: icmp }
      - targets: ['fd33:5692:1834:254::254']
        labels: {kind: tunnel, peer: ruby, family: v6, __param_module: icmp }
      - targets: ['192.168.254.2']
        labels: {kind: tunnel, peer: jennie, family: v4, __param_module: icmp }
      - targets: ['fd33:5692:1834:254::2']
        labels: {kind: tunnel, peer: jennie, family: v6, __param_module: icmp }
      # Resolution through Themis, end to end.
      - targets: ['192.168.8.50']
        labels: {kind: dns, check: public, __param_module: dns_public }
      - targets: ['192.168.8.50']
        labels: {kind: dns, check: internal, __param_module: dns_internal }
      - targets: ['192.168.8.50:853']
        labels: {kind: dns, check: dot, __param_module: dns_dot }
      # Lab certificates: every enrolled host's own (via node-exporter, keep in
      # step with the `node` job), plus the ones that are not the host
      # certificate - the Proxmox GUI, step-ca itself, mailcow, HA, Forgejo
      # and the n8n nginx on moby.
      - targets:
          - '192.168.8.21:9100'
          - '192.168.8.24:9100'
          - '192.168.8.27:9100'
          - '192.168.8.50:9100'
          - '192.168.8.51:9100'
          - '192.168.8.52:9100'
          - '192.168.8.53:9100'
          - '192.168.8.54:9100'
          - '192.168.8.55:9100'
          - '192.168.8.56:9100'
          - '192.168.8.57:9100'
          - '192.168.8.60:9100'
          - '192.168.8.61:9100'
          - '192.168.8.62:9100'
          - '192.168.8.21:8006'
          - '192.168.8.55:8443'
          - '192.168.8.57:443'
          - '192.168.8.90:443'
          - '192.168.8.62:443'
          - '192.168.8.27:443'
        labels: {kind: tls, __param_module: tls_lab }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
      - target_label: role
        replacement: prometheus

  # ruby and jennie seen from outside (homelab/outside): each runs a blackbox
  # exporter that probes the OTHER's public side, and this host scrapes each
  # exporter over that server's own tunnel - jennie over wg3, ruby over wg1 -
  # so either can report the other being down. Plain HTTP on purpose: the
  # exporters listen only on their dummy0 address, which is reachable only
  # through WireGuard, and neither server holds a lab certificate.
  #
  # Targets are public IP literals: both servers resolve ruby's names to its
  # tunnel addresses, so the modules carry the Host header and TLS name.
  - job_name: outside-jennie
    metrics_path: /probe
    scrape_interval: 2m
    scrape_timeout: 20s
    static_configs:
      - targets: ['145.239.73.18:25', '[2001:41d0:305:2100::1:3a0e]:25']
        labels: {vantage: jennie, subject: ruby, check: smtp, __param_module: smtp_mail }
      - targets: ['https://145.239.73.18/', 'https://[2001:41d0:305:2100::1:3a0e]/']
        labels: {vantage: jennie, subject: ruby, check: sogode.com, __param_module: https_sogode }
      - targets: ['https://145.239.73.18/', 'https://[2001:41d0:305:2100::1:3a0e]/']
        labels: {vantage: jennie, subject: ruby, check: ruby.peetvandesande.com, __param_module: https_ruby }
      - targets: ['https://145.239.73.18/', 'https://[2001:41d0:305:2100::1:3a0e]/']
        labels: {vantage: jennie, subject: ruby, check: peetvandesande.com, __param_module: https_peetvandesande }
      # The CA's frozen URLs, from outside the LAN (homelab/ca/ruby). Probed
      # from jennie because the point is the public path - probing from home
      # would test neither the DNS nor the internet leg. ruby proxies /g3/ to
      # pistis over wg1 and serves /g2/ from disk, so the g2 target is the one
      # that stays up when home is down. /g3/root.crt is G3's AIA caIssuers;
      # /g2/root.crl is the CDP of the three certificates signed before G3.
      - targets: ['http://145.239.73.18/g3/root.crl', 'http://[2001:41d0:305:2100::1:3a0e]/g3/root.crl']
        labels: {vantage: jennie, subject: ruby, check: ca-g3-crl, __param_module: http_ca }
      - targets: ['http://145.239.73.18/g3/root.crt', 'http://[2001:41d0:305:2100::1:3a0e]/g3/root.crt']
        labels: {vantage: jennie, subject: ruby, check: ca-g3-aia, __param_module: http_ca }
      - targets: ['http://145.239.73.18/g2/root.crl', 'http://[2001:41d0:305:2100::1:3a0e]/g2/root.crl']
        labels: {vantage: jennie, subject: ruby, check: ca-g2-crl, __param_module: http_ca }
      # Forgejo and n8n, proxied by ruby to the lab over wg1 (forgejo/ruby,
      # moby/ruby). Each passes only if the request got all the way home and
      # back, so like /g3/ they fail when home or wg1 does. n8n's editor is
      # also asserted closed: a 200 on / from here would mean it is public.
      - targets: ['https://145.239.73.18/api/healthz', 'https://[2001:41d0:305:2100::1:3a0e]/api/healthz']
        labels: {vantage: jennie, subject: ruby, check: git.peetvandesande.com, __param_module: https_git }
      - targets: ['https://145.239.73.18/webhook/outside-probe', 'https://[2001:41d0:305:2100::1:3a0e]/webhook/outside-probe']
        labels: {vantage: jennie, subject: ruby, check: n8n-webhook, __param_module: https_n8n_webhook }
      - targets: ['https://145.239.73.18/', 'https://[2001:41d0:305:2100::1:3a0e]/']
        labels: {vantage: jennie, subject: ruby, check: n8n-editor-closed, __param_module: https_n8n_editor_closed }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: family
        replacement: v4
      - source_labels: [__param_target]
        regex: '.*\[.*'
        target_label: family
        replacement: v6
      - target_label: __address__
        replacement: 192.168.254.2:9115

  - job_name: outside-ruby
    metrics_path: /probe
    scrape_interval: 1m
    static_configs:
      - targets: ['57.129.180.73', '2001:41d0:801:2000::180f']
        labels: {vantage: ruby, subject: jennie, check: ping, __param_module: icmp }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: family
        replacement: v4
      - source_labels: [__param_target]
        regex: '.*:.*'
        target_label: family
        replacement: v6
      - target_label: __address__
        replacement: 192.168.254.254:9115
