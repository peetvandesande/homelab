# Serve the API over TLS, and let Prometheus read the key.
#
# PrivateUsers=true in the packaged unit puts the service in a user namespace
# where supplementary groups are not mapped, so membership of `tlscert` alone
# does not get it read access to /etc/homelab-tls/host.key. Turning that
# sandbox off would be the lazy fix; instead SupplementaryGroups= names the
# group explicitly, which systemd applies inside the namespace.
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus $ARGS --web.config.file=/etc/homelab-tls/prometheus-web.yml
SupplementaryGroups=tlscert
