# Let Loki read the private key.
#
# The packaged unit runs as loki. The key is root:tlscert 0640, so the
# service needs the group; naming it here rather than relying on usermod alone
# keeps it working if the unit ever gains PrivateUsers=, which drops
# supplementary groups (see prometheus/ for where that bit).
[Service]
SupplementaryGroups=tlscert
