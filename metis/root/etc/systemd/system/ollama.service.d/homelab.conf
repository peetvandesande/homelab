# Ollama for the job search pipelines. Listens on every address; nftables
# (/etc/nftables.d/ollama.nft) admits only moby, where the n8n stacks run, and
# loopback. Ollama has no authentication of its own.
[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
# bge-m3 (~1.2G) and qwen3:4b (~3G) both fit the P2200's 5G at once.
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_NUM_PARALLEL=2"
